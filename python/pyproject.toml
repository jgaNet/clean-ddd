# The Python implementation of the reference. One project, managed by uv; the trees under src/
# are top-level packages (architecture, shared_kernel, contexts, bootstrap), imported by their
# absolute path, which is what the import linter matches on (ARCH-RELATIVE).
[project]
name = "clean-ddd"
version = "3.1.0"
description = "Clean Architecture + DDD reference, the Python rendering"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "bcrypt>=5.0.0",
  "fastapi>=0.146.0",
  "httpx>=0.28.1",
  "pyjwt>=2.15.1",
  "pyyaml>=6",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture", "src/shared_kernel", "src/contexts"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tools"]

[tool.ruff.lint]
# The architecture is held by tools/conventions.py, not by a lint rule: these are the language's own.
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "RUF", "ANN", "T20", "PL", "BLE"]
ignore = [
  "PLR2004", # a magic number in a test is the point of the test
  "PLR0913", # a factory takes every field of the snapshot
  "PLR0917", # and so does an aggregate's private constructor
  "ANN401",  # the event bus is type-erased by design (ADR 13)
  "BLE001",  # the base handlers catch everything on purpose: a stray raise becomes a failed operation
  "PLE1205", # the Logger port takes (message, error, meta); the lint mistakes it for the standard library's
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["PLR2004", "ANN", "T20"]
"tools/*" = ["T20"]  # a tool talks on the console

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tools"]
python_version = "3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src", "tools"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
