# The composition root: the one place that knows every context and every route, on the transport
# (`transport/`, which knows none). It may depend on anything; its end-to-end tests, under
# `tests/`, depend on it and on the libraries only (ARCH-E2E): they speak HTTP to the application
# they booted. Beside it, `starter/` is the composition a created application starts from (ADR 27).
[package]
name = "bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "application"
path = "src/main.rs"

[dependencies]
architecture-application = { path = "../architecture/application" }
architecture-infrastructure = { path = "../architecture/infrastructure" }
architecture-presentation = { path = "../architecture/presentation" }
bootstrap-transport = { path = "transport" }
notes-infrastructure = { path = "../contexts/notes/infrastructure" }
notes-presentation = { path = "../contexts/notes/presentation" }
notes-wiring = { path = "../contexts/notes/wiring" }
notifications-presentation = { path = "../contexts/notifications/presentation" }
notifications-wiring = { path = "../contexts/notifications/wiring" }
security-presentation = { path = "../contexts/security/presentation" }
security-wiring = { path = "../contexts/security/wiring" }
tracker-presentation = { path = "../contexts/tracker/presentation" }
tracker-wiring = { path = "../contexts/tracker/wiring" }
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
