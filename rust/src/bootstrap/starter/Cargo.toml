# The composition root an application starts from (ADR 27): `clean-ddd create` gives it to a new
# application in place of this repository's, which knows four contexts. It knows one, the
# Tracker, because a command is answered `202 { operationId }` and the Tracker is what a client
# follows that operation at. Built and tested here, on every build, so a fix to it is a fix to
# what the next application gets. It may depend on anything; its end-to-end test on it and on
# the libraries only (ARCH-E2E).
[package]
name = "bootstrap-starter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
architecture-application = { path = "../../architecture/application" }
architecture-infrastructure = { path = "../../architecture/infrastructure" }
bootstrap-transport = { path = "../transport" }
tracker-presentation = { path = "../../contexts/tracker/presentation" }
tracker-wiring = { path = "../../contexts/tracker/wiring" }
tokio.workspace = true

[dev-dependencies]
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
