# The Notes context's Application: its use cases. Its row of the table is its own Domain and
# Application, the building blocks' and the shared kernel's Domain and Application, nothing
# else (ARCH-APPLICATION); a test may add its own Infrastructure as doubles (ARCH-APPLICATION-SPECS).
[package]
name = "notes-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
architecture-domain = { path = "../../../architecture/domain" }
architecture-application = { path = "../../../architecture/application" }
shared-kernel-domain = { path = "../../../shared_kernel/domain" }
shared-kernel-application = { path = "../../../shared_kernel/application" }
notes-domain = { path = "../domain" }

[dev-dependencies]
architecture-infrastructure = { path = "../../../architecture/infrastructure" }
notes-infrastructure = { path = "../infrastructure" }
pollster.workspace = true

[lints]
workspace = true
