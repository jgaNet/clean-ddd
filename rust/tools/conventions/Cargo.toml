# `cargo run -p conventions`: the Rust conventions check. A tool, not a layer: it reads the
# contract and this language's binding and holds the workspace to them.
[package]
name = "conventions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "conventions"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true

[lints]
workspace = true
