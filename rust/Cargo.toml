# The Rust implementation of the reference. Every layer of every tree is a crate, and a crate's
# `[dependencies]` are its row of the dependency table in ../conventions/architecture.yaml: the
# compiler holds the boundary, and `cargo run -p conventions` proves the graph is the table.
[workspace]
resolver = "3"
members = ["src/architecture/*", "src/shared_kernel/*", "src/contexts/*/*", "src/bootstrap", "src/bootstrap/transport", "src/bootstrap/starter", "tools/*"]

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.85"

# Only the console logger and the tools write to the console; everything else logs through the Logger port.
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
indexmap = "2"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
# The transport and what only an adapter may see (the binding's `libraries`): HTTP, the runtime, tokens, hashing.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
jsonwebtoken = "9"
bcrypt = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
tower-http = { version = "0.6", features = ["cors", "normalize-path"] }
