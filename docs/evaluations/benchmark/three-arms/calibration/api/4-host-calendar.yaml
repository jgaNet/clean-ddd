# Request 4: blocked nights, the length of a stay, the calendar.
resources:
  listing:
    gains:
      minNights: { type: integer }
      maxNights: { type: integer }
routes:
  POST /v1/listings/{id}/block:
    2xx: {}
  POST /v1/listings/{id}/unblock:
    2xx: {}
  PUT /v1/listings/{id}/stay-limits:
    2xx: {}
  GET /v1/listings/{id}/calendar:
    200:
      type: array
      items:
        type: object
        required: [date, available]
        properties:
          date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
          available: { type: boolean }
