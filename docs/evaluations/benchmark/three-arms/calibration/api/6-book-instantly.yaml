# Request 6: a booking, confirmed at once, that keeps what its quote showed.
resources:
  booking:
    schema:
      type: object
      required: [id, listingId, travellerId, hostId, checkIn, checkOut, guests, lines, total, cancellationPolicy, status]
      properties:
        id: { type: string }
        listingId: { type: string }
        travellerId: { type: string }
        hostId: { type: string }
        checkIn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        checkOut: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        guests: { type: integer }
        lines:
          type: array
          items:
            type: object
            required: [label, for, amount]
            properties:
              label: { type: string }
              for: { enum: [host, external, platform] }
              amount: { type: integer }
        total: { type: integer }
        cancellationPolicy: { enum: [flexible, moderate, strict] }
        status: { enum: [confirmed] }
routes:
  POST /v1/bookings:
    2xx: { type: object, required: [id], properties: { id: { type: string } } }
  GET /v1/bookings/{id}:
    200: booking
  GET /v1/bookings/mine:
    200: { type: array, items: { $resource: booking } }
  GET /v1/listings/{id}/bookings:
    200: { type: array, items: { $resource: booking } }
