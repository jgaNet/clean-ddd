# `upgrade: true`: a change to what a tree already stored; its test records through the tree before it and reads
# through the tree graded, on one database (grade.mjs --previous). Request 20 is not one: it changes leaving from
# now on, and every member who left before it left at a balance of 0, so nothing stored reads differently
# (README, "Decided by the operator for checkpoint 2"). Request 30 is one: what a tree kept in its SQLite file
# moves to PostgreSQL, and its test asks for a payment through the tree before it and lands the payment's webhook
# through the tree graded (README, "Decided by the maintainer before checkpoint 3", 6).
