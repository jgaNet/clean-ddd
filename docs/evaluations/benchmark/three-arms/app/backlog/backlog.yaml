# J6's application, Tally (brief.md): checkpoint 1, requests 1 to 10, checkpoint 2, requests 11 to 20, and
# checkpoint 3, requests 21 to 30, taken in order, each from the smallest model up. `contexts` is the brief's candidate model until the storms decide it
