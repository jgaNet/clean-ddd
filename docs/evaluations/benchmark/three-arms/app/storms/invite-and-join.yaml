# Feature 3 of Tally (../backlog/3-invite-and-join.md), as the session decided it.
schemaVersion: 1

feature: invite-and-join
intent: >-
  Any member creates an invitation whose id is the link; anyone signed in who has it reads it and joins the group, once; the members are listed in the order they joined.

done: false

hotSpots:
  - question: Is an invitation part of the Group, or an aggregate of its own?
    decision: Its own — it is read by people who are not members, used any number of times and changes nothing of the group when it is created; accepting it changes the Group, which keeps that each account is a member once.
  - question: What makes the link safe?
    decision: The invitation's id is generated by the domain, long and random; it is the only proof a joiner needs.
  - question: The brief marks this request as crossing contexts. Does Ledger keep a copy of the members, fed by MemberJoined?
    decision: No — Ledger asks Groups who the members are when it decides (GroupMembers, feature 4), so a member who has just joined can be in a split at once; no integration event is published here (T3 in the README).

contexts:
  - id: Groups
    commands:
      - name: CreateInvitation
        actor: a signed-in account
        route: POST /groups/{param}/invitations
        aggregate: Invitation
        events: [InvitationCreated]
      - name: AcceptInvitation
        actor: a signed-in account
        route: POST /invitations/{param}/accept
        aggregate: Group
        events: [MemberJoined]
    queries:
      - name: GetInvitation
        actor: a signed-in account
        route: GET /invitations/{param}
      - name: GetGroupMembers
        actor: a signed-in account
        route: GET /groups/{param}/members
    events: [InvitationCreated, MemberJoined]
    policies: []

links: []
