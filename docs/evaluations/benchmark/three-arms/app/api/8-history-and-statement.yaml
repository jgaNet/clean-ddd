# Request 8: the group's expenses, the latest first, and a member's statement, the earliest first.
resources:
  statement:
    schema:
      type: object
      required: [memberId, balance, entries]
      properties:
        memberId: { type: string }
        balance: { type: integer }
        entries:
          type: array
          items:
            type: object
            required: [expenseId, date, description, paid, share, balance]
            properties:
              expenseId: { type: string }
              date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
              description: { type: string }
              paid: { type: integer }
              share: { type: integer }
              balance: { type: integer }
routes:
  GET /v1/groups/{id}/expenses:
    200: { type: array, items: { $resource: expense } }
  GET /v1/groups/{id}/members/{memberId}/statement:
    200: statement
