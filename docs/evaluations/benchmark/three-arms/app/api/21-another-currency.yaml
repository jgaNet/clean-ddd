# Request 21: an expense in another currency, at the rate its payer states; the rate and both amounts are kept.
resources:
  # Restated whole, as requests 4, 6 and 7 left it, with `original`, which an expense in another currency has and one
  # in the group's currency does not (a `gains` would require it of both).
  expense:
    schema:
      type: object
      required: [id, groupId, description, amount, date, paidBy, shares, version, splitKind]
      properties:
        id: { $comment: request 4, type: string }
        groupId: { $comment: request 4, type: string }
        description: { $comment: request 4, type: string }
        amount: { $comment: request 4, type: integer }
        date: { $comment: request 4, type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        paidBy: { $comment: request 4, type: string }
        shares:
          $comment: request 4
          type: array
          minItems: 1
          items:
            type: object
            required: [memberId, amount]
            properties:
              memberId: { type: string }
              amount: { type: integer }
        version: { $comment: request 6, type: integer, minimum: 1 }
        splitKind: { $comment: request 7, enum: [equal, exact, shares] }
        original:
          type: object
          required: [currency, amount, rate]
          properties:
            currency: { enum: [EUR, USD, GBP, CHF, CAD, AUD] }
            amount: { type: integer, minimum: 1 }
            rate: { type: string, pattern: '^\d+(\.\d{1,6})?$' }
routes:
  POST /v1/groups/{id}/expenses:
    2xx: { type: object, required: [id], properties: { id: { type: string } } }
  PUT /v1/expenses/{id}:
    2xx: {}
  GET /v1/expenses/{id}:
    200: expense
