# Request 4: an expense, split equally between members, the remainder to the payer; its shares add up.
resources:
  expense:
    schema:
      type: object
      required: [id, groupId, description, amount, date, paidBy, shares]
      properties:
        id: { type: string }
        groupId: { type: string }
        description: { type: string }
        amount: { type: integer }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        paidBy: { type: string }
        shares:
          type: array
          minItems: 1
          items:
            type: object
            required: [memberId, amount]
            properties:
              memberId: { type: string }
              amount: { type: integer }
routes:
  POST /v1/groups/{id}/expenses:
    2xx: { type: object, required: [id], properties: { id: { type: string } } }
  GET /v1/expenses/{id}:
    200: expense
