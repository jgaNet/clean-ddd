# Request 22: the rate a rates service offers, which an expense in another currency takes or corrects within 2 %.
resources:
  rate:
    schema:
      type: object
      required: [currency, date, rate]
      properties:
        currency: { enum: [EUR, USD, GBP, CHF, CAD, AUD] }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        rate: { type: string, pattern: '^\d+(\.\d{1,6})?$' }
routes:
  GET /v1/groups/{id}/rates/{currency}:
    200: rate
