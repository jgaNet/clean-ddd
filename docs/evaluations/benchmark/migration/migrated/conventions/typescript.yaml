  decorator:
    canonical:
      - src/Contexts/Tracker/Infrastructure/TrackedEventBus.ts
  unit-of-work:
    canonical:
      - src/Architecture/Infrastructure/UnitOfWork/InMemoryUnitOfWork.ts
  the-database:
    canonical:
      - src/Architecture/Infrastructure/DataSources/InMemoryDataSource.ts
  presenters:
