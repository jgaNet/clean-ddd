      - src/Architecture/Application/Application.ts
      - src/Bootstrap/Fastify/FastifyApplication.ts
      - src/Bootstrap/Fastify/application.ts

# linkbox was migrated from a legacy (ADR 36; the record is docs/evaluations/2026-11-08-migration-by-hand.md
# of the reference). Its clients speak the legacy's wire, served under /v1 by the compatibility routes
# below while they move to the contract's grammar under /v2; each route stands for one operation of the
# inventory, and goes when the last client has moved.
migration:
  api: compat
  compatibility_routes:
    - method: POST
      path: /links
      operation: SaveLink
      file: src/Bootstrap/Compat/legacy.routes.ts
      retires: when the mobile application 2.x is out of support
    - method: GET
      path: /links
      operation: GetLinks
      file: src/Bootstrap/Compat/legacy.routes.ts
      retires: when the mobile application 2.x is out of support
    - method: GET
      path: '/links/{id}'
      operation: GetLink
      file: src/Bootstrap/Compat/legacy.routes.ts
      retires: when the mobile application 2.x is out of support
    - method: POST
      path: '/links/{id}/archive'
      operation: ArchiveLink
      file: src/Bootstrap/Compat/legacy.routes.ts
      retires: when the mobile application 2.x is out of support
    - method: GET
      path: /activity
      operation: GetActivity
      file: src/Bootstrap/Compat/legacy.routes.ts
      retires: when the mobile application 2.x is out of support
