# J5b, simple-3: requests 51 to 100 from the tree prepared at 50 (README.md beside this file). The tree is the project
# given with --project; run from the reference's root with node .claude/flow/run-ladder.mjs.
run: j5b-simple-3
arm: simple
kit: ../j5
base: main
of: 100
ladder: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5]
agent: { runner: claude-cli, timeoutMinutes: 90 }
retry: { perFeature: 1 }
budgetUsd: 60
agentBudgetUsd: 12
dependencies: copy
ports: { base: 20700 }
machine: { ladders: 2 }
gradeTimeoutMinutes: 120
regressionCheck: { from: 2 }
triage: { judge: claude-sonnet-5-5 }
push: { remote: https://github.com/jgaNet/openstay, branch: j5b/simple-3, logBranch: j5b-logs/simple-3 }
features: [conversations, unread-messages, contact-details-held-back, attachments, message-notices, reporting-a-message, reviews, guest-reviews, ratings, host-replies, review-rules, sort-by-rating, reporting-a-listing, moderation-queue, upholding-reports, suspending-accounts, audit-log, suspicious-accounts, payment-instructions, listing-verification, claims, claims-with-money, transfer-proof, support, notice-preferences, email-verification, two-factor, trader-information, registration-numbers, donations, donations-never-rank, transparency, payment-costs, countries, listing-languages, user-language, currencies, indicative-prices, payouts-per-currency, card-fees-passed-on, city-tourist-tax, tax-rates-by-date, night-cap, hosts-report, calendar-export, calendar-import, import-conflicts, terms-versions, operations-dashboard, pausing-payouts]
