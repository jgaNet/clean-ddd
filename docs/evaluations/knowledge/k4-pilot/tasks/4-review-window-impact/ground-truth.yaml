task: 4-review-window-impact
kind: impact                       # predicting impact before changing anything (RFC 0006, §8)
start: c1ac8da7a796bfd94f7793b6d1f48cd0b665eaa8
change: the review window becomes 30 days after the check-out instead of 14, and everything the window decides follows it
