      - src/Contexts/Reviews/Domain/StayReview/StayReviewReports.spec.ts
      - src/Bootstrap/Fastify/reviews.e2e.spec.ts
      - src/Bootstrap/Fastify/ratings.e2e.spec.ts
# The rule mutated (REVIEW_WINDOW_DAYS = 30 and nothing else), measured on 13 November in the pilot's scratch copy:
# 6 unit tests in 3 files and 3 end-to-end tests in 2 files fail; every other test of the tree passes.
mutation_fails:
  tree_own:
    - Rating.spec.ts › publication › counts a lone traveller’s review only once its window has closed
    - StayReviews.spec.ts › StayReviews: the traveller reviews the stay › is refused the day of the check-out, and once the 14 days after it are over
    - StayReviews.spec.ts › StayReviews: the host reviews the guest › is refused for a stay that did not take place, outside the window, and for a rating or comment out of range
    - StayReviews.spec.ts › the review window and the publication of a stay’s reviews › is the 14 days after the check-out, and the window closing publishes what is written the day after them
    - StayReviews.spec.ts › StayReviews: the host replies to the traveller’s review › is written once the window has closed, when the guest review was never written
    - StayReviewReports.spec.ts › StayReviews: a review that is not published › is reported by another account once the window has closed and it is published alone
    - reviews.e2e.spec.ts › Booking → Reviews › a traveller reviews a stay that took place once, and it is published when its window closes
    - reviews.e2e.spec.ts › Host → Reviews › a host review waits for the traveller or the window, and two sent at once give one review
    - ratings.e2e.spec.ts › Reviews → Listings, Booking and hosts (ratings) › rates a listing and its host from the published traveller’s reviews only, as their windows close
  # The J5 kit's hidden tests that hold the 14 days are superseded by such a change. They are not the agent's to predict
  # (it cannot see them); for the record, on the reference solution (60, 61 and 62 pass):
  kit_j5_superseded:
    - 57-reviews › a review after a stay › publishes a review, to anyone, once its window has closed, without anyone acting, and refuses a review after it
    - 57-reviews › a review after a stay › lists a listing's published reviews, the most recently written first
    - 58-guest-reviews › the host reviews the guest › publishes a lone review when the window closes, refuses one after it, and lists a traveller's reviews the most recent first
    - 59-ratings › ratings › rates a host over every published review of every listing they host, whatever its state, for anyone

