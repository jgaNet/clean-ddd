  tests:                           # scored: precision and recall, by exact path
    required:
      - src/Contexts/Reviews/Domain/StayReview/Rating.spec.ts
      - src/Contexts/Reviews/Domain/StayReview/StayReviews.spec.ts
      - src/Contexts/Reviews/Domain/StayReview/StayReviewReports.spec.ts
