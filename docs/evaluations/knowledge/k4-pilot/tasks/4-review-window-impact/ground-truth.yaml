  changes:
    source:
      - src/Contexts/Reviews/Domain/StayReview/ReviewWindow.ts             # REVIEW_WINDOW_DAYS = 30
      - src/Contexts/Reviews/Domain/StayReview/StayReviewExceptions.ts     # OutsideReviewWindow's message says the days
    tests:
      - src/Contexts/Reviews/Domain/StayReview/Rating.spec.ts
