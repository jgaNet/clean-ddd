      - src/Contexts/Moderation/Presentation/API/REST/Routes/review-reports.e2e.spec.ts
  rules:                           # scored by a judge (README.md, "Measures"): each predicted rule matched to one below or none
    required:
      - id: window
        says: a traveller reviews a stay, and a host its guest, from the day after the check-out up to N days after it;
          outside it the review is refused (OutsideReviewWindow; requests 57, 58; isInReviewWindow, REVIEW_WINDOW_DAYS)
      - id: publication
        says: a review is published when both reviews of the stay are written or the window has closed (request 58,
          ADR 60; windowClosed, isPublished); this decides what listings, bookings and guest reviews show
      - id: ratings
        says: a listing's and a host's rating count published traveller's reviews only, so they move when windows close;
          the search's rating order follows (requests 59, 62; publishedTravellerReviews, ratingsOfListings)
      - id: replies
        says: a host replies to a traveller's review once it is published (request 60, ADR 62)
      - id: reports
        says: a review is reported only once it is published (request 61)
    distractors:                   # look alike and are not touched; naming one counts against precision
      - id: claims-window
        says: a claim on a stay is opened within 14 days after the check-out (Support; CLAIM_WINDOW_DAYS, ClaimRules.ts,
          ADR 74) — the same number, another rule
      - id: review-rules
        says: a comment's length, contact details and links (request 61; ReviewRules.ts) — another rule of the same context
