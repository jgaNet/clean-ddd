<!-- The Open Graph image, 1200 × 630, in the site’s codes. Render it once to open-graph.png with a headless browser at that viewport (Playwright: page.screenshot after document.fonts.ready) when its text changes. -->
<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:'Inter Variable';font-weight:100 900;src:url('../fonts/inter-latin-wght-normal.woff2') format('woff2-variations')}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0b012e;color:#e5ecf6;font-family:'Inter Variable',sans-serif;letter-spacing:-.025em;position:relative;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.6}
.a{width:520px;height:520px;left:-120px;top:120px;background:#4c3584}
.b{width:460px;height:460px;right:-100px;top:-60px;background:rgba(228,59,125,.45)}
.c{width:380px;height:380px;left:520px;bottom:-200px;background:rgba(255,82,17,.3)}
.in{position:relative;height:100%;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between}
.mark{font-weight:800;font-size:40px;letter-spacing:-.04em;background:linear-gradient(to right,#ff5211,#e43b7d,#b08ae6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:22px;font-weight:700;letter-spacing:.025em;text-transform:uppercase;color:#ff5211;margin-bottom:18px}
h1{font-size:66px;line-height:1.08;letter-spacing:-.05em;font-weight:700;max-width:1000px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;color:#cbd5e1;font-size:24px}
.foot b{font-weight:600;color:#fff}
.pill{display:inline-block;padding:12px 28px;border-radius:999px;background:linear-gradient(to right,#ff5211,#e43b7d,#4c3584);color:#fff;font-weight:600;font-size:24px}
</style></head><body>
<div class="glow a"></div><div class="glow b"></div><div class="glow c"></div>
<div class="in">
<div class="mark">CLEAN-DDD</div>
<div><div class="tag">Clean Architecture &amp; DDD · TypeScript · Rust · Python · Go</div>
<h1>Une architecture que l’outillage fait respecter, mesurée avec des agents IA</h1></div>
<div class="foot"><span>Une implémentation de référence, écrite pour être lue · <b>exostic.com</b></span><span class="pill">Lire les résultats</span></div>
</div></body></html>
