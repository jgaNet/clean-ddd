# The same feature plan as share-a-note.yaml, written for the Rust binding: `language` names
# the binding whose checklists say where each part goes, and the check validates it against the
# Rust tree. The parts the Rust implementation has so far are listed, each `new: false`, so that
# the check confirms they are where the binding's checklists say — `<aggregate>` and `<use_case>`
# filled in snake_case, as a Rust path wants.

schemaVersion: 1

feature: share-a-note
language: rust
context: Notes

intent: >-
  The owner of a note shares it with another account, which can then read it. The people a note
  is shared with are told about it. The canonical path from HTTP to a domain event and across a
  context boundary, as Rust writes it.

changes:
  - kind: aggregate
    name: Note
    new: false
  - kind: domain-service
    name: NoteSharing
    aggregate: Note
    new: false
  - kind: command
    name: ShareNote
    verb: act
    route: POST /notes/:id/share
    new: false
  - kind: query
    name: GetNotesSharedWithMe
    verb: read
    route: GET /notes/shared
    new: false
  - kind: integration-event
    name: NoteSharedIntegrationEvent
    aggregate: Note
    new: false
  - kind: event-handler
    name: NoteShared
    new: false

invariants:
  - Only the owner of a note shares it.
  - An archived note cannot be shared.
  - A note is not shared twice with the same account, nor with its owner.
  - The recipient must be an account that exists — a rule that needs a port, so a domain service holds it.

events:
  - NoteSharedEvent

crossContext:
  context: Notifications
  strategy: integration-event
  why: >-
    The recipient is told that a note was shared with them. Notifications learns the fact from
    the published contract and restates it in its own words; Notes knows nothing of it.

architectureChanges: false
