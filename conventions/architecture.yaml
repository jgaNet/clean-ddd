# The architecture, as data: the architecture contract. This file is the part that is true in
# every language the reference is written in — the layers, what each may import, the rules, the
# HTTP grammar, the two modes. It names no file, no alias, no linter and no tool: those belong to
# a language binding (`typescript.yaml`, one per entry of `languages` below), which says where the
# trees are in that language, which file shows each concept and which tool holds each rule.
#
# Everything here is checked by tooling, in each language:
#   - the import rules of the language (ESLint in TypeScript) are generated from `layers`;
#   - the conventions check of the language proves the tree has the shape `layers` describe, and
#     that this file and the binding are well-formed (unique ids, existing references);
#   - `yarn architecture rule <id>` (the tooling at the root) explains any rule, for a human or a tool (`--json`).
#
# Read the layers as: "a file in layer X of context C may import from ...". Anything not listed
# is forbidden. The words:
#   own.<Layer>          the same layer or another layer of the same context
#   own.wiring           the context's wiring file
#   architecture.<Layer> that layer of the building blocks (mechanics, no vocabulary)
#   kernel.<Layer>       that layer of the shared kernel (Email, Role, guards, contracts)
#   others.<Layer>       that layer of any other context
#   others.wiring        another context's wiring file (for what it exports)
#   bootstrap            the composition root (settings, the application)
#   libraries            the infrastructure libraries the binding lists (HTTP, crypto, tokens...)
#
# Every rule has a stable id (never renumbered, never reused), a reason and a remediation, and
# says how it is enforced: `linter` (import rules generated from this table), `check` (the
# conventions check), `types` (the compiler), `tests` (a spec names the behaviour), `review`
# (stated, read by people and agents, not yet mechanical), `evaluations`. Saying `review` is the
# honest word, not a weaker rule. The binding says which tool stands behind each word.
#
# Paths in this file are relative to the repository root; a binding's are relative to its own
# directory. The decision behind the split is docs/adr/0011-one-reference-several-languages.md.

schemaVersion: 1

# The languages the reference is written in: one binding each, conventions/<language>.yaml.
languages: [typescript, rust, python, go]

layers:
  Domain:
    id: ARCH-DOMAIN
    may_import: [own.Domain, architecture.Domain, kernel.Domain]
    why: The Domain layer depends on nothing outside its own Domain, the building blocks' Domain and the shared kernel's Domain.
    remediation: >-
      Whatever the domain needs from outside, declare it as a port in Domain/<Aggregate>/Ports and let
      the infrastructure implement it; a fact from another context arrives as a value through such a port.
    references: [docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md]

  Application:
    id: ARCH-APPLICATION
    may_import: [own.Domain, own.Application, architecture.Domain, architecture.Application, kernel.Domain, kernel.Application]
    why: >-
      The Application layer depends on its own Domain and Application, the Domain and Application of
      the building blocks and of the shared kernel (integration events included), nothing else.
    remediation: >-
      A handler that needs an adapter asks for the port in its constructor; the wiring file passes the
      implementation. A handler that needs another context reacts to its integration event or asks a
      port its own context owns.
    references: [docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md]
    specs:
      id: ARCH-APPLICATION-SPECS
      may_import: [own.Infrastructure, architecture.Infrastructure]
      why: Application tests may use their own in-memory Infrastructure as test doubles, nothing further out.
      remediation: Use the in-memory adapter of the port as the double; do not reach for Presentation, Bootstrap or another context.
      references: []

  Infrastructure:
    id: ARCH-INFRASTRUCTURE
    may_import:
      - own.Domain
      - own.Application
      - own.Infrastructure
      - architecture.Domain
      - architecture.Application
      - architecture.Infrastructure
      - kernel.Domain
      - kernel.Application
      - others.Domain
      - libraries
    why: >-
      The Infrastructure layer implements its own ports; it may read another context's Domain
      (ports, read models) but not its Application, Infrastructure, Presentation or wiring.
    remediation: >-
      Read the other context through its read-model port (its Domain/Ports), never its handlers or
      adapters; translate into your own words in the adapter.
    references:
      - docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md

  Presentation:
    id: ARCH-PRESENTATION
    may_import:
      - own.Domain
      - own.Application
      - own.Presentation
      - architecture.Domain
      - architecture.Application
      - architecture.Presentation
      - kernel.Domain
      - kernel.Application
      - libraries
    why: >-
      The Presentation layer talks to its own Application layer (handlers, module) and Domain
      (read models, exceptions); never to Infrastructure, wiring, Bootstrap or another context.
    remediation: A controller gets its Module from the route options, which the composition root passes; it never builds an adapter.
    references: []

# The two modes a change can be made in, as data, so that a person, a tool or an agent can be
# held to one. The feature mode proves a change touched none of the protected trees; the
# architecture mode allows them and asks for the decision that explains them. Nothing here is a
# CI gate: the maintainer changes the architecture on purpose, and the check is for whoever has
# agreed to work under a constraint. What is protected here is what every language shares — the
# contract, the decisions and the tooling at the root; each binding adds its building blocks, its shared kernel and its linter.
modes:
  feature:
    why: >-
      A feature is written inside the architecture, not around it. Under this mode the building
      blocks, the shared kernel's model, the conventions and the decisions are immutable; if the
      work seems to need one of them changed, that is the finding, and it becomes an
      architecture change with its own reasoning.
    # The tooling at the root holds every language to this file; a feature does not change it.
    protected: [conventions, docs/adr, tools]
    # A feature may bring its plan, and the storm the session decided it would be; and, since a feature
    # may publish, the integration event it declares in the published language (ADR 44), where the gate
    # refuses a merged version changed in place; and, since a feature may refuse, the rule it names in the
    # rule register (ADR 46).
    allowed: [conventions/plans, conventions/storms, conventions/integration-events.yaml, conventions/rules.yaml]
  architecture:
    why: >-
      The architecture may change; it may not change silently. A change to the building blocks,
      to the shared kernel's model or to the dependency table is a decision, and a decision is
      written down where the next reader will find it.
    decides: [conventions/architecture.yaml]
    records: docs/adr

# A migrated application keeps its behaviour and chooses the wire it answers on (ADR 36). The
# choice is the binding's `migration` (`api`, and under `compat` its `compatibility_routes`: method,
# path, the one `operation` of the inventory each stands for, the `file` under the transport that
# serves it, when it `retires` — a date the check holds, or the condition in words). Nothing of a
# context differs between the two wires; switching to native is removing the routes.
migration:
  rule: ARCH-COMPAT-ROUTE
  api:
    native: The contract's grammar alone. No compatibility route is declared; the legacy's scenario is translated before it is replayed.
    compat: The legacy's routes beside the contract's grammar, served by compatibility routes in the transport; the legacy's scenario is replayed as recorded.

# Two kinds of file that are not a layer.
wiring_file:
  id: ARCH-WIRING
  may_import: [own.*, architecture.*, kernel.*, others.wiring, bootstrap, libraries]
  why: >-
    A wiring file binds its own context and may import another context's wiring for what it
    exports; it never reaches inside another context.
  remediation: Export what another context needs from your wiring file (a read-model adapter, a module); import only that.
  references: []

e2e_specs:
  id: ARCH-E2E
  may_import: [bootstrap, libraries]
  why: >-
    End-to-end tests boot the application through the Bootstrap helper and speak HTTP; they do
    not reach into any layer.
  remediation: Prove it over HTTP; if you need a fact only the code knows, the read model is missing it.
  references: []

relative_imports:
  id: ARCH-RELATIVE
  statement: A relative import names a sibling file and nothing else; anything across directories goes through the path the import rules are written against.
  why: The import rules are written against those paths (an alias, a crate path); a relative path across directories would bypass them.
  remediation: Import through the path the rules match on; the binding names it.
  references: []

# How a use case is exposed over HTTP. The verb follows what the request does to what the URL
# names, not the handler's name. The nouns are the reference's own (a note, a notification): the
# same application is written in every language, so the routes are too.
http:
  rule: ARCH-PRESENTATION
  # What a command answered 202 becomes when its caller reads it (ADR 41): the record the Tracker
  # projects, as every language answers it. `record` is a JSON Schema (draft-07), so that a kit's
  # requests or a product's API can be checked against it before anything is written; a kit that
  # wants another shape decides it in its first request, and the check names the conflict.
  operation:
    read: GET /tracker/operations/:id
    statuses:
      PENDING: The command is accepted and not yet decided.
      SUCCESS: The command's handler decided it; `result` is what it answered, when it answered something.
      ERROR: The command was refused, or failed; `error` names the rule that refused it.
      SENT: A fact delivered to its subscribers, which answer nothing. A command's operation never ends here.
    record:
      type: object
      required: [id, name, status, traceId, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, description: 'The public name: the intent or the fact without the suffix of its kind (API-ONE-SURFACE).' }
        status: { enum: [PENDING, SUCCESS, ERROR, SENT] }
        traceId: { type: string }
        subjectId: { type: string, description: 'The account that asked, when the request was authenticated.' }
        result: { description: 'What the handler answered on success: any JSON value.' }
        error:
          type: object
          description: The refusal, in the client's words — the rule's exception (`type`) and its message.
          required: [type, message]
          additionalProperties: false
          properties:
            type: { type: string }
            message: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, description: 'Once the command is decided: SUCCESS or ERROR.' }
      allOf:
        - if: { properties: { status: { const: ERROR } }, required: [status] }
          then: { required: [error, finishedAt] }
          else: { not: { required: [error] } }
        - if: { properties: { status: { const: SUCCESS } }, required: [status] }
          then: { required: [finishedAt] }
          else: { not: { required: [result] } }
  verbs:
    - intent: read
      verb: GET
      shape: GET /notes/:id
      when: A query. It never changes state, and answers synchronously.
    - intent: create
      verb: POST
      shape: POST /notes
      when: A command that brings a new thing into existence. Answers 202 with the operation id, or 401 at once to a caller who is not signed in (API-CALLER-AT-TRANSPORT).
    - intent: act
      verb: POST
      shape: POST /notes/:id/share
      when: A command that is an action on an existing thing, named after the action.
    - intent: create-under
      verb: POST
      shape: POST /notes/:id/comments
      when: A command that adds one item to a collection the URL names.
    - intent: replace
      verb: PUT
      shape: PUT /notes/:id
      when: A command that replaces the editable content of a thing.
    - intent: replace-part
      verb: PUT
      shape: PUT /notes/:id/tags
      when: A command that replaces one named part of a thing, wholesale.
    - intent: change-part
      verb: PATCH
      shape: PATCH /notifications/:id/read
      when: A command that changes part of a thing's state without replacing it.
    - intent: remove
      verb: DELETE
      shape: DELETE /notes/:id/bookmark
      when: A command that removes a thing the caller created and the URL identifies. A thing with a lifecycle is archived, not deleted.
    - intent: link-in-an-email
      verb: GET
      shape: GET /auth/validate?validation_token=…
      when: A command behind a link someone clicks in an email. The exception, not a pattern to copy. The link carries its own proof, so its handler says anyone may ask for it (API-CALLER-AT-TRANSPORT).

# The grammar of the Lite profile (ADR 40): the same verbs for the same intents, and every command
# answered at once, by the use case the route calls — no 202, no operation to follow. A refusal is
# answered at once too: 400 with the rule's exception (`{ type, message }`) for a rule the domain
# refuses, 401 to a caller who is not signed in, 403 to a signed-in caller the rule refuses, 404 for
# a thing that is not there, 409 for a thing another writer changed since it was read. A command
# whose outcome is read later is not in this grammar: it brings in the bus and the operations
# (the trigger command-answered-later), by an ADR.
http-lite:
  rule: ARCH-PRESENTATION
  verbs:
    - intent: read
      verb: GET
      shape: GET /notes/:id
      when: A query. It never changes state, and answers 200 with its read model.
    - intent: create
      verb: POST
      shape: POST /notes
      when: A command that brings a new thing into existence. Answers 201 with the new thing's id (`{ id }`), at once.
    - intent: act
      verb: POST
      shape: POST /notes/:id/share
      when: A command that is an action on an existing thing, named after the action. Answers 200 with what the use case returns, or 204 when it returns nothing.
    - intent: create-under
      verb: POST
      shape: POST /notes/:id/comments
      when: A command that adds one item to a collection the URL names. Answers 201 with the item's id.
    - intent: replace
      verb: PUT
      shape: PUT /notes/:id
      when: A command that replaces the editable content of a thing. Answers 200 or 204, at once.
    - intent: replace-part
      verb: PUT
      shape: PUT /notes/:id/tags
      when: A command that replaces one named part of a thing, wholesale. Answers 200 or 204, at once.
    - intent: change-part
      verb: PATCH
      shape: PATCH /notifications/:id/read
      when: A command that changes part of a thing's state without replacing it. Answers 200 or 204, at once.
    - intent: remove
      verb: DELETE
      shape: DELETE /notes/:id/bookmark
      when: A command that removes a thing the caller created and the URL identifies. Answers 204. A thing with a lifecycle is archived, not deleted.
    - intent: link-in-an-email
      verb: GET
      shape: GET /auth/validate?validation_token=…
      when: A command behind a link someone clicks in an email. The exception, not a pattern to copy. Answers at once; the link carries its own proof, so its use case says anyone may ask for it.

# The kinds of thing a feature is made of, each pointing at the concept whose canonical file
# shows it. Where one goes and what it is made of in a given language is the binding's
# `checklists`, under the same kinds.
checklists:
  aggregate: { concept: aggregate-root }
  value-object: { concept: value-object }
  domain-service: { concept: domain-service }
  command: { concept: command-handler }
  query: { concept: query-handler }
  integration-event: { concept: integration-event }
  event-handler: { concept: domain-event-handler }
  context: { concept: module }

# Architecture profiles (docs/adr/0040-architecture-profiles-one-contract-one-engine-profiles-as-data.md):
# one contract, one engine, profiles as data. A profile is a way of holding this file, never a second
# wording of it (ARCH-ONE-CONTRACT). It says, for every rule below and every row of the table:
#   - `holds`: the rules it holds (`all`: every rule it neither waives nor holds on a trigger, so a rule
#     added later is held until the profile says otherwise);
#   - `waives`: the rules it does not hold, each with its reason;
#   - `conditional`: the rules it holds only where a trigger fires, each with its trigger, one of the
#     closed set the engine can see in the inventory (`yarn architecture profiles` lists them);
#   - `gaps`: the rules it holds by `review` alone, named as gaps, never presented as guarantees;
#   - `grammar`: the HTTP grammar it answers on (a section of this file with `verbs`: `http`, `http-lite`);
#   - `checklists`: the kinds of thing its features are made of (`all`, or a list of `checklists`' kinds);
#   - `mechanisms`: what it does with each mechanism of Full that no rule mandates, RFC 0002's H2 table
#     as data, each with its reason — `kept`; `not_used`, with the trigger that brings it in (`until`),
#     by an ADR, where there is one the engine can see; or `uses`, a shape of its own in its place. A
#     profile that says nothing here uses every mechanism, as written.
# Exactly one profile is the default. A binding names the profile of a context (`profiles: { <Context>:
# <profile> }`); a context it does not name is held to the binding's `default_profile` when it says one
# (an application created Lite), else to the default, and changing one is an architecture change with an
# ADR. A binding holds a profile other than the default only where it says how, under `profiles_held`
# (its checklists, the files that show its mechanisms); one that does not reports it as a gap ("Lite: not
# held"), and the check refuses a context held to it there. The conventions check holds every profile
# (P1–P4, P6 of RFC 0002).
#
# The floor: the guarantees no profile may drop, each with the rules that hold it. A floor rule may be held
# on a trigger where the guarantee itself is conditional (a write races only where several writers can, a
# fact must be durable where another context reacts to it), never waived. A guarantee held by review, or
# by no rule yet, says its gap; one held by something that is not a rule says what (`held_by: modes`).
floor:
  - guarantee: Dependencies point inward
    rules: [ARCH-INWARD, ARCH-TREES]
  - guarantee: Contexts stay apart
    rules: [CTX-CONTRACTS, ARCH-CONTEXT-DECLARED]
  - guarantee: Every relationship between two contexts is declared
    rules: [CTX-MAP-DECLARED]
  - guarantee: What a context publishes to the others is declared once
    rules: [CTX-PUBLISHED-LANGUAGE]
  - guarantee: The domain imports no framework
    rules: [ARCH-DOMAIN]
  - guarantee: An invariant is enforced where its state lives, and a refusal is a value
    rules: [DOMAIN-RESULT]
  - guarantee: A write is consistent where several writers can race
    rules: [CONC-OPTIMISTIC]
  - guarantee: A fact another context reacts to is durable with its state
    rules: [EVENT-AFTER-COMMIT]
  - guarantee: Identity is born once
    rules: [DOMAIN-IDENTITY]
    gap: Held by review; the gate's relationship test sees it where a binding turns the step on (ADR 33).
  - guarantee: Who reaches a command is said once and held at the transport
    rules: [API-CALLER-AT-TRANSPORT]
  - guarantee: The architecture does not change silently
    rules: []
    held_by: modes

profiles:
  full:
    name: Full
    default: true
    why: >-
      The contract as written: every rule held, in every context, by its own enforcement, and the grammar
      that answers a command with 202 and its operation. The profile the reference is written in.
    holds: all
    waives: {}
    conditional: {}
    gaps: [ARCH-MODULES-DATA, ARCH-EXECUTION-CONTEXT, DOMAIN-IDENTITY, DOMAIN-NON-DETERMINISM]
    grammar: http
    checklists: all
  lite:
    name: Lite
    why: >-
      An experiment (RFC 0002, ADR 40), held in TypeScript alone: every boundary of Full kept — the layers,
      the contexts apart, the context map, integration events through the outbox, the ports a context
      owns, wiring as data — and the ceremony inside a context dropped. A use case is a function of its
      ports that calls a pure decision (ADR 43), listed in the context's Module and called by the route,
      which holds who may call it and answers at once; aggregates and
      domain events come in where a trigger fires, by an ADR. Promoted, kept as an experiment or removed by
      the criteria registered before its campaign.
    # Every rule named, so that a rule added later is a decision for Lite rather than held by default.
    holds:
      - ARCH-DOMAIN
      - ARCH-APPLICATION
      - ARCH-APPLICATION-SPECS
      - ARCH-INFRASTRUCTURE
      - ARCH-PRESENTATION
      - ARCH-WIRING
      - ARCH-E2E
      - ARCH-RELATIVE
      - ARCH-INWARD
      - ARCH-TREES
      - ARCH-CONTEXT-DECLARED
      - ARCH-MODULES-DATA
      # The Module lists each use case once and every route calls one it lists: the check reads both.
      - ARCH-ONE-HANDLER
      - ARCH-EXECUTION-CONTEXT
      - DOMAIN-RESULT
      - DOMAIN-IDENTITY
      - DOMAIN-NON-DETERMINISM
      - DOMAIN-ONE-CLOCK
      - QUERY-READ-MODELS
      - CTX-CONTRACTS
      - ARCH-MAP-IS-REAL
      - ARCH-LEARNABLE
      - ARCH-ONE-CONTRACT
      - API-ONE-SURFACE
      - API-BODY-SHAPE
      # Every use case needs a signed-in caller unless its definition says anyone, and the transport refuses a
      # missing one with 401 before it runs (ADR 43); a role the rule refuses is the use case's 403.
      - API-CALLER-AT-TRANSPORT
      - CTX-MAP-DECLARED
      - CTX-PUBLISHED-LANGUAGE
      # A decision's refusal is a context's exception like any other: named in the register where there is one.
      - DOMAIN-RULE-NAMED
      - ARCH-ONE-APPLICATION
      - ARCH-COMPAT-ROUTE
    waives: {}
    conditional:
      # Domain events come in where something reacts to one; then only an aggregate records them.
      DOMAIN-RECORDS-EVENTS: reacts-to-domain-event
      # An aggregate comes in where two writers can race on one thing: its version, its snapshot.
      DOMAIN-CREATE-VS-RECONSTITUTE: several-writers
      CONC-OPTIMISTIC: several-writers
      # A fact another context reacts to is durable with its state: the outbox, as in Full.
      EVENT-AFTER-COMMIT: publishes-integration-event
    gaps: [ARCH-MODULES-DATA, ARCH-EXECUTION-CONTEXT, DOMAIN-IDENTITY, DOMAIN-NON-DETERMINISM]
    grammar: http-lite
    checklists: all
    mechanisms:
      command-bus:
        not_used: >-
          The command bus, the CommandEvent class and the handler class: the route calls the use case the
          Module lists, and one function decides one command.
        until: command-answered-later
      operations:
        not_used: >-
          The 202, the operation and the Tracker a client follows it at: a command is answered at once, by
          its use case's result.
        until: command-answered-later
      aggregates:
        not_used: >-
          An aggregate for everything: a use case validates with value objects and the domain's functions,
          and writes through its store.
        until: several-writers
      domain-events:
        not_used: A fact nothing reacts to is not recorded.
        until: reacts-to-domain-event
      queries-port:
        not_used: A query is a function of the store it reads, returning a read model.
      ports-inside-a-context:
        not_used: >-
          Ports only at the edges — the store, an outside system, another context; nothing inside a
          context is behind an interface it implements itself.
      one-file-per-concept:
        not_used: A file per use-case group and per thing, not a folder per use case.
      use-case:
        uses: >-
          A use case is a function of its ports, named for its intent, run by the building block in the
          request's transaction, retried from a fresh read on a conflict, refused with a Result.
      answered-at-once:
        uses: >-
          The transport answers a use case's result at once, a refusal with its status and the rule's exception,
          and refuses a missing caller with 401 before a use case runs, unless the use case says anyone may call
          it (ADR 43).
      decision:
        uses: >-
          A command's rules live in a decision (ADR 43, after RFC 0005's P1): a pure function of the state, the
          command and the time, which answers the new state and the facts it records, or the rule's refusal;
          it imports no port, is not async and reads no clock. The use case is the shell that loads, calls it,
          saves and publishes.
      integration-events:
        kept: A fact another context reacts to is a contract in the shared kernel, as in Full.
      outbox:
        kept: An integration event is made durable with the state it describes and published after the commit.
      inbox:
        kept: The bus delivers a message it already delivered once only, by the outbox entry's id.
      owned-ports:
        kept: A context asks another through a port it owns, answered by an adapter over the other's read model.
      context-map:
        kept: Every relationship between two contexts is declared before the code carries it.
      module-as-data:
        kept: One wiring file per context, listing its use cases and its reactions as data.

# The rules that are not a row of the table. Each says how it is enforced.
rules:
  - id: ARCH-INWARD
    name: dependencies-point-inward
    statement: Dependencies point inward and contexts stay apart — each file imports only what its row of the dependency table allows; there is no exception and none may be added.
    why: A boundary that can be crossed when convenient is not a boundary; the table is the architecture.
    remediation: Fix a violation with a port, an integration event or a move, never by silencing the linter (the conventions check refuses a silenced rule).
    enforcement: linter
    references: [conventions/architecture.yaml, conventions/README.md]

  - id: ARCH-TREES
    name: building-blocks-and-shared-kernel
    statement: The building blocks import nothing outside themselves, not even the shared kernel; the shared kernel imports the building blocks and no context.
    why: The building blocks are mechanics and must know no vocabulary, not even the roles; the shared kernel is the part of the domain model every context agrees on, built on those mechanics.
    remediation: Vocabulary (a role, an email, a policy) goes to the shared kernel; mechanics go to the building blocks; a context's things stay in the context.
    enforcement: linter
    references: []

  - id: ARCH-CONTEXT-DECLARED
    name: every-context-is-declared
    statement: Every directory under the contexts tree is a context declared in the language's binding, holds only the declared layers and its wiring file.
    why: An undeclared context has no import rule applying to it.
    remediation: Add the context to `contexts` in the binding; move stray files into a layer.
    enforcement: check
    references: [conventions/README.md]

  - id: ARCH-MODULES-DATA
    name: modules-are-plain-data
    statement: A context's wiring is one file building a Module as data — its name, its commands, its queries, its domain event and integration event handlers; anything else it exposes is a named export of that file. No container, no builder, no service locator.
    why: Wiring that is data can be read in one screen and explained to an agent; a container hides which handler answers which command.
    remediation: Construct the handler, pass its ports, list it in the Module.
    enforcement: review
    references: []

  - id: ARCH-ONE-HANDLER
    name: one-handler-per-command
    statement: A command has exactly one handler — the Module lists it once, with one handler, and every command a route or a policy builds is one the Module lists; a fact may have any number of subscribers.
    why: Commands and facts share one bus, and they differ in what an answer is — a command's outcome is its handler's result, so two handlers would answer with two outcomes and none with no outcome, while a fact is told to whoever listens and nobody is a fine answer.
    remediation: List the command once in the Module with the one handler that decides it; a second reaction to the same intent is a policy on the fact that handler records, not a second handler; a command a route builds and nobody answers is a handler missing from the wiring.
    enforcement: check
    references: [docs/adr/0026-a-command-has-exactly-one-handler.md]

  - id: ARCH-EXECUTION-CONTEXT
    name: execution-context-carries-only-the-request
    statement: ExecutionContext carries what exists per request and nothing else — who is calling, the trace, the transaction, the bus, the logger. A mailer, a clock, a model client is a constructor dependency of the handler that needs it.
    why: A context that grows is a service locator with a better name; a handler's needs belong in its signature.
    remediation: Add a port, inject it in the constructor, pass it from the wiring file.
    enforcement: review
    references: []

  - id: DOMAIN-RESULT
    name: expected-failures-are-results
    statement: A refused command or query is a failed Result value, never a thrown exception; throwing (or panicking) is for programming errors and corrupted state only.
    why: A refusal is a normal outcome the caller must handle; a throw is a crash that hides it.
    remediation: Return a failed Result carrying the rule's exception from the behaviour; let the handler pass it on; the base handler turns a stray throw into a failed operation.
    enforcement: tests
    references:
      - docs/adr/0001-result-instead-of-exceptions.md

  - id: DOMAIN-RECORDS-EVENTS
    name: only-an-aggregate-root-records-events
    statement: Only an aggregate root records domain events (`record(...)` inside a behaviour); handlers never construct one, they call `publishDomainEvents(aggregate, context)` after saving.
    why: The fact belongs to the object whose rule produced it; a handler that builds events can lie about what happened.
    remediation: Move the `record()` call into the behaviour that changes the state.
    enforcement: types
    references: []

  - id: DOMAIN-CREATE-VS-RECONSTITUTE
    name: creation-validates-reconstitution-throws
    statement: '`create()` / `register()` validates and records a creation event; `fromSnapshot()` records nothing and throws on corrupted data.'
    why: Rebuilding from storage is not a business fact; corrupted storage is a programming error, not a refusal.
    remediation: Keep validation in the value objects so both paths re-run it; throw in `fromSnapshot()`, return a Result in `create()`.
    enforcement: tests
    references:
      - docs/adr/0004-reconstitution-throws-on-corrupted-data.md

  - id: DOMAIN-IDENTITY
    name: identity-is-generated-by-the-domain
    statement: An aggregate generates its own identity (`Id.generate()` in `create()`). A repository loads and saves aggregates, and answers the facts a domain rule needs about the collection (`findByEmail`, `countByOwner`); it never hands out identities and never searches for a screen. Identity is born once — a thing first made in one context and taken up by another keeps the id it was born with; the integration event that announces it carries that id, and the receiving side builds its object on it instead of generating a new one, so the id a client was answered finds the thing in every context.
    why: No persistence round-trip is needed to know who an object is, and the event of its creation can carry its id; a client holds one id for one thing, and a second id made downstream is a thing it cannot find.
    remediation: Generate the Id in the factory; remove any "next id" method from the repository. Downstream of an integration event, put the announced id in the event's payload and pass it to the receiving aggregate's factory (`create({ id, … })`), never `Id.generate()` there; a thing made about another one (a report about a message) has its own id, and that is the one its event carries.
    enforcement: review
    references:
      - docs/adr/0002-identity-is-generated-by-the-domain.md
      - docs/adr/0033-identity-is-born-once-and-a-relationship-crossed-is-tested.md

  - id: DOMAIN-NON-DETERMINISM
    name: non-determinism-enters-as-a-value
    statement: Time comes from the one clock the wiring passes (DOMAIN-ONE-CLOCK); identity is generated by the domain; anything else that is not a function of the business state (randomness, a model, a person, another system) lives behind a port named for what it decides, and its result is a plain value the aggregate validates and may refuse.
    why: The same state and command must give the same outcome; the source proposes, the domain disposes.
    remediation: Declare the port in the Application layer of the context, hand its result to the aggregate like any input, keep the provenance on the operation.
    enforcement: review
    references:
      - docs/adr/0007-non-determinism-enters-the-domain-as-a-value.md

  - id: DOMAIN-ONE-CLOCK
    name: time-comes-from-one-clock
    statement: >-
      An application has one now: a clock the wiring builds and passes to whatever decides or records a time — a
      command handler, an event handler, a job, an adapter, the bus — and that hands it to the domain as a parameter,
      always given; a domain method's time parameter has no default, and nothing but the building blocks' system clock
      reads the machine's time.
    why: >-
      The same state and command must give the same outcome, and a time is part of the command. A default that reads
      the machine lets one forgotten call decide on another now than the rest of the application — a deadline one
      handler sees passed and the sweep beside it does not — and nothing fails until a test moves the clock; one clock
      passed from the wiring is the one place a test, a demo or an offset moves time for everything at once.
    remediation: >-
      Take a `Clock` in the constructor of the handler, job or adapter that needs the time, pass the system clock from
      the wiring file, and give `clock()` to the behaviour; remove the default from the domain method's time parameter.
      A test passes a fixed clock.
    enforcement: linter
    references:
      - docs/adr/0042-an-application-has-one-clock.md

  - id: EVENT-AFTER-COMMIT
    name: domain-events-publish-after-commit
    statement: Domain events are made durable with the state they describe, in the same transaction (the outbox), and published from there after the commit — never before, and never from memory alone; a rolled-back transaction stores nothing and leaves the events on the aggregate; a fact a crash kept from being published is published on the next relay, so a subscriber may see a fact twice and the bus delivers a message it already delivered once only; a reaction runs in a transaction of its own, and what it saves and what it publishes are made durable and published the same way.
    why: Listeners must only ever see facts that are durable, and every durable fact must reach them; publishing from memory after the commit loses the facts a crash interrupts, so the facts are stored first and at-least-once delivery is paid for with idempotent delivery.
    remediation: >-
      Call `publishDomainEvents()`: it appends the aggregate's events to the unit of work's outbox at commit and the
      context relays the outbox after it; never publish from inside a behaviour; carry the entry's id as the message's
      id, and let the bus recognise it. In a reaction, the base handler opens the transaction: save, call
      `publishDomainEvents()` or `publishIntegrationEvent()`, and return a failed Result to undo all of it — never publish
      straight to the bus, and never make the reaction idempotent by hand.
    enforcement: tests
    references:
      - docs/adr/0003-publish-domain-events-after-commit.md
      - docs/adr/0030-a-reaction-is-a-transaction-of-its-own.md
      - docs/adr/0024-events-are-durable-before-they-are-published.md

  - id: QUERY-READ-MODELS
    name: queries-return-read-models
    statement: Queries return read models, repositories return aggregates; never the other way.
    why: The read side is free to be shaped for screens; the write side is where the rules live.
    remediation: Add a read-model shape to the queries port; never return an aggregate from a query, never a read model into a behaviour.
    enforcement: types
    references: [docs/adr/0005-queries-return-read-models-not-aggregates.md]

  - id: CTX-CONTRACTS
    name: integration-events-and-owned-ports
    statement: Contexts talk in two ways only — integration events published in the shared kernel, and ports the asking side owns, answered by an adapter over the other context's read model; a context's Domain never imports another context.
    why: The contract between contexts must be a visible, versionable file, not a class that changes for its own reasons.
    remediation: Publish an integration event from a domain event handler and consume it through an anti-corruption handler; or declare a port in your words and adapt the other context's read model.
    enforcement: linter
    references: [docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md]

  - id: CONC-OPTIMISTIC
    name: optimistic-concurrency-on-save
    statement: An aggregate carries the version it was read at and never changes it; `save()` stores version + 1 and refuses an aggregate that is no longer at the stored version with a ConcurrencyConflictException; the command handler then re-reads and re-decides in a new transaction, up to three attempts, and the third conflict is the operation's refusal.
    why: A consistency boundary is only as good as the write; of two writers who read the same version only the first may win, and the second, re-run on what the first wrote, usually wins too — a rule re-decided on fresh state is a decision, a write re-applied blindly is not.
    remediation: Check the stored version in the adapter the way the store makes atomic (an UPDATE ... WHERE version = ?), return a failed Result; let the base handler retry `execute()` from a fresh read, and let the third conflict reach the client, who re-reads and decides.
    enforcement: tests
    references:
      - docs/adr/0008-optimistic-concurrency-on-the-aggregate.md
      - docs/adr/0025-a-conflict-is-retried-from-a-fresh-read-then-refused.md

  - id: ARCH-MAP-IS-REAL
    name: the-map-names-real-files
    statement: Every file the concept map names exists, every documentation link resolves, nothing silences the linter, and the generated import rules refuse and allow what the probes say.
    why: A reference whose map points at nothing teaches nothing.
    remediation: Run the conventions check; fix the file or the map, never the check.
    enforcement: check
    references: [conventions/concepts.yaml]

  - id: ARCH-LEARNABLE
    name: a-newcomer-can-add-a-feature-from-the-docs
    statement: A newcomer, or an agent, can add a feature in the right shape from the documentation alone.
    why: That is what a reference is for.
    remediation: Run a fresh-agent evaluation; every guess in its report is a sentence missing from the guide.
    enforcement: evaluations
    references: [docs/evaluations/README.md]

  - id: ARCH-ONE-CONTRACT
    name: every-language-is-held-to-the-same-contract
    statement: Every language the reference is written in is held to this file — the same layers, the same rules under the same ids, the same HTTP grammar — through a binding that says where its trees are and which file shows each concept; a language never carries a rule of its own.
    why: The architecture is one thing rendered in several languages; a second wording of a rule is a second thing to drift.
    remediation: Put the rule here and point the binding at the file that shows it; what a language cannot hold, it reports as a gap in its binding, not as a rule it lacks.
    enforcement: check
    references: [docs/adr/0011-one-reference-several-languages.md, conventions/README.md]

  - id: API-ONE-SURFACE
    name: every-language-answers-the-same-api
    statement: Every language answers the same HTTP API — the same routes, status codes, body shapes and public names — so one black-box scenario, run against each server, passes unchanged; the public name of an operation is its intent or its fact without the suffix of its kind (`ShareNote`, `NoteShared`).
    why: A reference in several languages teaches one application, not three; a client, a front end or a test that works against one server must work against the others, and the API is where that is visible.
    remediation: Fix the server that differs, never the scenario; a name that leaks a class suffix is stripped where the record is projected, not renamed on the bus.
    enforcement: tests
    references: [docs/adr/0016-one-api-for-every-language.md, docs/adr/0041-an-operation-read-is-in-the-contract.md]

  - id: API-BODY-SHAPE
    name: a-command-body-is-refused-for-its-shape-only
    statement: A command's request body is refused by the transport for its shape only — a field missing or of the wrong type answers 400; whether a value is allowed (one of a list, a format, a length, a range, a count) is the domain's to decide, and its refusal is the operation's ERROR behind the 202, named by the rule's exception.
    why: Which values are allowed is a business rule. It lives once, in the domain, has a name the client can act on, and changes with the business; a schema that refuses it answers a 400 with no name, and is a second copy of the rule that drifts from the first.
    remediation: Keep `type` and `required` in the body's schema and remove any keyword that rules on a value; let the value object or the aggregate refuse the value with its exception, from the string the body sent.
    enforcement: tests
    references: [docs/adr/0032-a-command-body-is-refused-for-its-shape-only.md]

  - id: API-CALLER-AT-TRANSPORT
    name: a-command-whose-outcome-is-read-later-needs-a-caller-at-the-transport
    statement: A command whose outcome is read later (answered 202 with an operation) needs a signed-in caller unless its handler says, once, that anyone may ask for it, and so does a use case of a profile that answers every command at once unless its definition says so; the transport refuses a missing caller at once with 401, before anything is published or run, in the one helper every such route calls. A query that needs a caller and has none answers 401 too, 403 is for a signed-in caller the rule refuses, and any other command answered at once keeps its own 4xx; the handler still asks for its caller's id and the aggregate, or the decision, still decides what that caller may do.
    why: A client that is not signed in learns it at once, instead of following an operation that was never going to succeed; missing credentials are a 401 in HTTP, and one refusal has one status. Said once on the handler and held in one helper, who reaches a command cannot differ from one route to the next — routes that each checked the caller in their own way did, and a new route copied whichever it saw first.
    remediation: Answer a 202 route through the transport's helper, never by publishing a command on the bus from the route, and a route of a profile that answers at once through its own; mark the handler or the use case of a command anyone may ask for (signing up, a link that carries its own proof, a provider's webhook) and no other; answer a query's refusal of a caller who is not signed in with 401 and of a signed-in caller with 403; leave any other command answered at once its own 4xx.
    enforcement: tests
    references: [docs/adr/0039-a-command-whose-outcome-is-read-later-needs-a-caller-at-the-transport.md]

  - id: CTX-MAP-DECLARED
    name: the-context-map-is-declared-and-true
    statement: Every relationship between two contexts is declared once in the context map, with the strategic pattern it follows, the mechanism that carries it and why; the contracts it carries are read from the code, and the check refuses a link in the code the map does not declare and a declared relationship nothing in the code carries, unless it is declared `planned` — decided before the code that carries it.
    why: A context map drawn by hand and never checked is a wish; one read from the code alone is an inventory with no intent in it. Declaring the pair, the pattern and the reason, and deriving the contracts, keeps both honest, and makes a new relationship between two contexts a decision written down before it is merged.
    remediation: Add the relationship to `relationships` in the domain map with its pattern and its reason — declared `planned` when it is decided before the code that carries it — or remove the link in the code, if the coupling was not meant; never widen the check.
    enforcement: check
    references: [docs/adr/0019-the-domain-is-data.md, docs/adr/0028-a-relationship-is-decided-before-its-code.md, conventions/README.md]

  - id: CTX-PUBLISHED-LANGUAGE
    name: integration-events-are-a-published-language
    statement: Every integration event is declared once in the published language, with the context that publishes it, the thing it announces when it announces one, and the payload of each version it was published in; every language's code carries the last version, field for field, and the check holds each inventory to it; a version once merged is changed only by an added optional field — a field removed, renamed or retyped is a new version, and the gate refuses the change in place; an event that announces a thing carries the id it was born with.
    why: An integration event is the one promise a context makes to the others, and a promise kept in four hand-written copies drifts unseen — a field another language names differently, an id a consumer needs and the event forgot, a change that breaks a consumer made in place. Declared once and held by the check, the payload is one thing in every language, and a breaking change says so with a new version.
    remediation: Declare the event, its publisher and its payload in the published language before the code publishes it, and make each language's event carry the last version field for field; to remove, rename or retype a field, append a version rather than edit one; give an event that announces a thing the id field it names.
    enforcement: check
    references: [docs/adr/0044-integration-events-are-a-published-language-declared-once.md, conventions/README.md]

  - id: DOMAIN-RULE-NAMED
    name: a-rule-is-named-with-its-origin-and-its-evidence
    statement: Every refusal a context's domain can return is declared once in the rule register, by its public name, with the context that decides it, the rule in the business's words and where it was decided; the code returns it as that context's exception and at least one test of that context names it; the check refuses a refusal no rule names, a rule no code returns and a rule no test names, and holds nothing where there is no register.
    why: A rule that lives as an exception in the domain, a sentence in a storm and a test is three things nothing ties together — a refusal returned that no rule names, a rule named that no test holds — and a later request that relies on it finds it by accident or not at all. Declared once with its origin and held to its evidence, a rule is one unit a person or an agent can read.
    remediation: Name a new refusal in the register before the code returns it — its public name (the exception without the suffix of its kind), its context, one sentence, its origin — and write a test of that context that names it; remove the entry with the last code that returns it.
    enforcement: check
    references: [docs/adr/0046-a-rule-is-a-named-unit-with-its-origin-and-its-evidence.md, conventions/README.md]

  - id: ARCH-ONE-APPLICATION
    name: every-language-is-the-same-application
    statement: Every language's tree says the same application, in words every language shares — the commands of each context with who may call them, their route, the aggregate they reach and the events it records; the queries; the domain events; the policies and what they publish or reach; the links between contexts; each language's tool writes that inventory from its own tree, and the check holds the inventories equal.
    why: The scenario holds the servers to one API from the outside; the inventory holds the trees to one model from the inside. A command one language has and another lacks, or a policy that reaches different facts, is one application in three languages and something else in the fourth, and nothing a client sees would say so.
    remediation: Fix the tree that differs, never the inventory — a missing command, a route that differs, a policy that reaches other events is a divergence to close in the code; then regenerate the inventory with the language's tool and commit it.
    enforcement: check
    references: [docs/adr/0021-one-application-every-language-writes-the-same-inventory.md, conventions/README.md]

  - id: ARCH-COMPAT-ROUTE
    name: a-compatibility-route-is-declared-bound-and-retired
    statement: >-
      A compatibility route — the legacy's wire a migrated application serves while its clients move to the contract's grammar — lives in the transport and nowhere else, is declared in the language's binding under `migration` with the one command or query of the inventory it stands for and the condition of its retirement, waits for the outcome with the awaited operation and answers the legacy's shape; under `api: native` none is declared, and nothing outside the transport waits for an operation.
    why: >-
      While both wires are served the wire is written twice, and the second copy stays honest only if each route names the one operation it stands for, says when it goes, and lives where the grammar does not reach; a route in a context that waited for its outcome would be a second HTTP grammar inside the architecture.
    remediation: >-
      Declare the route under `migration.compatibility_routes` in the binding, served from a file under the transport, bound to a command or query the inventory lists, with `retires`; remove it and say `api: native` once the clients have moved; a wait outside the transport is a route that belongs in the façade.
    enforcement: check
    references: [docs/adr/0036-a-migrated-application-keeps-its-behaviour-and-chooses-its-wire.md, conventions/README.md]
