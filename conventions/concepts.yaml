    rules:
      - ARCH-PRESENTATION
  - id: presenters
    name: Presenters (one use case, several formats)
    layer: presentation
    canonical:
      - src/Contexts/Security/Presentation/Presenters/Auth
      - src/Architecture/Presentation/Format.ts
    example: >-
      [`Security/Presentation/Presenters/Auth`](src/Contexts/Security/Presentation/Presenters/Auth), picked
      per request by [`Format.ts`](src/Architecture/Presentation/Format.ts) — a plain object per controller,
