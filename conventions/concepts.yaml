      - CONC-OPTIMISTIC
  - id: queries-implementation
    name: Queries implementation
    layer: infrastructure
    canonical:
      - src/Contexts/Notes/Infrastructure/Queries/InMemoryNoteQueries.ts
    example: '[`InMemoryNoteQueries.ts`](src/Contexts/Notes/Infrastructure/Queries/InMemoryNoteQueries.ts)'
    description: builds read models from the same store, here
    rules:
      - ARCH-INFRASTRUCTURE
      - QUERY-READ-MODELS
  - id: second-adapter-of-the-same-port
    name: '**Second adapter of the same port**'
    layer: infrastructure
    canonical:
      - src/Contexts/Notes/Infrastructure/Repositories/SqliteNoteRepository.ts
      - src/Contexts/Notes/Infrastructure/Queries/SqliteNoteQueries.ts
    example: >-
      [`SqliteNoteRepository.ts`](src/Contexts/Notes/Infrastructure/Repositories/SqliteNoteRepository.ts),
      [`SqliteNoteQueries.ts`](src/Contexts/Notes/Infrastructure/Queries/SqliteNoteQueries.ts) on Node's
      built-in `node:sqlite`
    description: >-
      the proof that the port is the seam: a real database behind the same interfaces, not one line changed in
      Domain or Application. The local wiring keeps the in-memory pair; both are held to
      [`NotePersistence.contract.spec.ts`](src/Contexts/Notes/Infrastructure/NotePersistence.contract.spec.ts)
    examples:
      - src/Contexts/Notes/Infrastructure/NotePersistence.contract.spec.ts
    rules:
      - ARCH-INFRASTRUCTURE
  - id: port-implementations
    name: Port implementations
    layer: infrastructure
    canonical:
      - src/Contexts/Security/Infrastructure/Services/JoseSignedTokens.ts
