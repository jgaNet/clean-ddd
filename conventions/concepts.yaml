    example: >-
      [`JoseSignedTokens.ts`](src/Contexts/Security/Infrastructure/Services/JoseSignedTokens.ts) (`jose`),
      [`BcryptPasswordHasher.ts`](src/Contexts/Security/Infrastructure/Services/BcryptPasswordHasher.ts)
    description: ''
    rules:
      - ARCH-INFRASTRUCTURE
  - id: event-bus
    name: Event bus
    layer: infrastructure
    canonical:
      - src/Architecture/Infrastructure/EventBus/InMemoryEventBus.ts
    example: '[`InMemoryEventBus.ts`](src/Architecture/Infrastructure/EventBus/InMemoryEventBus.ts)'
