# The architectural vocabulary of the reference, as data: every concept the documentation teaches,
# with the rules that govern it and the decisions that explain it, in no language. Which file shows
# a concept is a language's business: its binding (`typescript.yaml`) names the canonical file
# under the same id, and the root README's map — concept × language — is rendered from the two.
# A concept a binding does not name is a gap the map shows, not a reason to drop the row.
#
# One canonical example per concept and per language. `rules` must name ids from architecture.yaml;
# `references` are ADRs; `description` is Markdown, written for the README, and names no file.
# `yarn architecture concept <id>` (the tooling at the root) answers from here and from its binding.
schemaVersion: 1
concepts:
  - id: entity
    name: Entity
    layer: domain
    description: identity, `equals()`
    rules: []
  - id: aggregate-root
    name: Aggregate root
    layer: domain
    description: behaviours enforce invariants and `record()` events
    rules:
      - DOMAIN-RECORDS-EVENTS
      - CONC-OPTIMISTIC
  - id: entity-inside-an-aggregate
    name: '**Entity inside an aggregate** (not a root)'
    layer: domain
    description: >-
      has its own identity, exists only inside `Notification`, reached and persisted through it. The
      criterion: few, consistent with the root in the same change, written through the root. What grows
      without bound or is written by others is its own aggregate (comments on a note)
    rules:
      - DOMAIN-RECORDS-EVENTS
  - id: value-object
    name: Value object
    layer: domain
    description: built through `create()` → `Result`; never invalid once you hold one
    rules:
      - DOMAIN-RESULT
  - id: identity
    name: Identity
    layer: domain
    description: >-
      generated by the domain (`Id.generate()`), not by the database — [ADR
      2](docs/adr/0002-identity-is-generated-by-the-domain.md)
    rules:
      - DOMAIN-IDENTITY
    references:
      - docs/adr/0002-identity-is-generated-by-the-domain.md
  - id: factory
    name: Factory
    layer: domain
    description: >-
      the aggregate is its own factory: a static `create()` that validates, generates the identity and records
      the creation event; the constructor is private. When creation needs a collaborator (a port), the factory
      is a domain service. No `Factory` class
    rules:
      - DOMAIN-CREATE-VS-RECONSTITUTE
      - DOMAIN-IDENTITY
  - id: invariant
    name: Invariant
    layer: domain
    description: >-
      a rule that must hold after every change (only the owner, not archived, not twice, not with yourself):
      checked inside the behaviour, before the state changes and the event is recorded. There is no
      `validate()` to forget, and no way to reach the state but through the behaviour
    rules:
      - DOMAIN-RESULT
  - id: creation-vs-reconstitution
    name: Creation vs reconstitution
    layer: domain
    description: >-
      creation records an event; rebuilding from persistence records nothing — [ADR
      4](docs/adr/0004-reconstitution-throws-on-corrupted-data.md)
    rules:
      - DOMAIN-CREATE-VS-RECONSTITUTE
    references:
      - docs/adr/0004-reconstitution-throws-on-corrupted-data.md
  - id: domain-event
    name: Domain event
    layer: domain
    description: past tense, minimal payload, internal to the context
    rules:
      - DOMAIN-RECORDS-EVENTS
      - EVENT-AFTER-COMMIT
  - id: domain-exception
    name: Domain exception
    layer: domain
    description: >-
      a broken rule in business words, carried by `Result.fail()`, never thrown — [ADR
      1](docs/adr/0001-result-instead-of-exceptions.md)
    rules:
      - DOMAIN-RESULT
    references:
      - docs/adr/0001-result-instead-of-exceptions.md
  - id: result
    name: '`Result`'
    layer: domain
    description: '`IResult<T>` is the type you write in signatures'
    rules:
      - DOMAIN-RESULT
  - id: optimistic-concurrency
    name: '**Optimistic concurrency**'
    layer: domain
    description: >-
      the aggregate carries the version it was read at and never changes it; the repository stores version + 1
      and refuses a stale one with `ConcurrencyConflict`, so of two writers who read the same version only the
      first wins — [ADR 8](docs/adr/0008-optimistic-concurrency-on-the-aggregate.md)
    rules:
      - CONC-OPTIMISTIC
    references:
      - docs/adr/0008-optimistic-concurrency-on-the-aggregate.md
  - id: repository-port
    name: Repository port
    layer: domain
    description: load / save an aggregate; nothing else
    rules:
      - QUERY-READ-MODELS
      - CONC-OPTIMISTIC
      - ARCH-DOMAIN
  - id: queries-port-read-models
    name: Queries port & read models
    layer: domain
    description: >-
      returns view shapes, never aggregates — [ADR
      5](docs/adr/0005-queries-return-read-models-not-aggregates.md)
    rules:
      - QUERY-READ-MODELS
    references:
      - docs/adr/0005-queries-return-read-models-not-aggregates.md
  - id: snapshot-dto
    name: Snapshot DTO
    layer: domain
    description: the plain shape that crosses to the infrastructure
    rules:
      - DOMAIN-CREATE-VS-RECONSTITUTE
  - id: domain-service
    name: '**Domain service**'
    layer: domain
    description: a rule about the whole collection ("one account per email") — needs the port, still pure domain
    rules:
      - ARCH-DOMAIN
  - id: port-to-another-context
    name: '**Port to another context** (read side)'
    layer: domain
    description: >-
      Notes asks "does this account exist?" in its own words; only its infrastructure knows Security is next
      door. The read-side counterpart of the anti-corruption layer for events
    rules:
      - CTX-CONTRACTS
      - ARCH-INFRASTRUCTURE
  - id: ports-for-technical-concerns
    name: Ports for technical concerns
    layer: domain
    description: hashing has a business meaning; the algorithm does not belong here
    rules:
      - ARCH-DOMAIN
      - DOMAIN-NON-DETERMINISM
  - id: lifecycle-as-an-enum
    name: Lifecycle as an enum
    layer: domain
    description: the transitions live in the aggregate, not in the enum
    rules: []
  - id: command
    name: Command
    layer: application
    description: >-
      a named payload, nothing more. It extends `CommandEvent`, one of the three kinds of message the
      building blocks define: a command travels on the same bus as the events and is tracked as an
      operation, so it has their shape; the class says its intent (one handler, may be refused)
    rules:
      - ARCH-APPLICATION
  - id: command-handler
    name: Command handler
    layer: application
    description: the shape every "change an existing thing" use case follows
    rules:
      - DOMAIN-RESULT
      - EVENT-AFTER-COMMIT
  - id: guard
    name: Guard (authorization)
    layer: application
    description: '*who may call* is answered here; *what they may do to which object* is the aggregate''s business'
    rules:
      - DOMAIN-RESULT
  - id: application-service
    name: Application service
    layer: application
    description: orchestrates ports for a use case several entry points share; holds no rule of its own
    rules:
      - ARCH-APPLICATION
  - id: base-handler
    name: Base handler (guard, transaction, safety net)
    layer: application
    description: a concrete handler only writes `execute()`
    rules:
      - DOMAIN-RESULT
      - EVENT-AFTER-COMMIT
  - id: query-handler
    name: Query handler
    layer: application
    description: reads through the queries port; a refused query is a failed `Result`, not a throw
    rules:
      - QUERY-READ-MODELS
  - id: execution-context
    name: Execution context
    layer: application
    description: who is calling, with which logger, bus and unit of work; `withTransaction`, `afterCommit`
    rules:
      - ARCH-EXECUTION-CONTEXT
      - EVENT-AFTER-COMMIT
  - id: publish-after-commit
    name: Publish after commit
    layer: application
    description: '[ADR 3](docs/adr/0003-publish-domain-events-after-commit.md)'
    rules:
      - EVENT-AFTER-COMMIT
    references:
      - docs/adr/0003-publish-domain-events-after-commit.md
  - id: domain-event-handler
    name: Domain event handler
    layer: application
    description: where a fact leaves its context
    rules:
      - CTX-CONTRACTS
  - id: integration-event
    name: Integration event (published contract)
    layer: application
    description: >-
      the only thing one context may know about another — [ADR
      6](docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md)
    rules:
      - CTX-CONTRACTS
    references:
      - docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md
  - id: anti-corruption-layer
    name: '**Anti-corruption layer**'
    layer: application
    description: restates a foreign fact in local terms
    rules:
      - CTX-CONTRACTS
  - id: projection-read-model
    name: '**Projection / read model**'
    layer: application
    description: a context with no aggregate at all
    rules:
      - QUERY-READ-MODELS
  - id: non-determinism-as-a-value
    name: '**Non-determinism as a value** (ADR 7)'
    layer: application
    description: >-
      a decision the domain cannot make from its own state (a model, a heuristic, a person) enters it as a
      value the aggregate validates and may refuse; the provenance travels with it and ends on the operation —
      [ADR 7](docs/adr/0007-non-determinism-enters-the-domain-as-a-value.md)
    rules:
      - DOMAIN-NON-DETERMINISM
    references:
      - docs/adr/0007-non-determinism-enters-the-domain-as-a-value.md
  - id: module
    name: Module (wiring)
    layer: application
    description: 'plain data: which handler answers which command, query, event'
    rules:
      - ARCH-MODULES-DATA
      - ARCH-WIRING
  - id: repository-implementation
    name: Repository implementation
    layer: infrastructure
    description: snapshot in, snapshot out
    rules:
      - ARCH-INFRASTRUCTURE
      - CONC-OPTIMISTIC
  - id: queries-implementation
    name: Queries implementation
    layer: infrastructure
    description: builds read models from the same store, here
    rules:
      - ARCH-INFRASTRUCTURE
      - QUERY-READ-MODELS
  - id: second-adapter-of-the-same-port
    name: '**Second adapter of the same port**'
    layer: infrastructure
    description: >-
      the proof that the port is the seam: a real database behind the same interfaces, not one line changed in
      Domain or Application. The local wiring keeps the in-memory pair; both are held to the same contract
      spec
    rules:
      - ARCH-INFRASTRUCTURE
  - id: port-implementations
    name: Port implementations
    layer: infrastructure
    description: ''
    rules:
      - ARCH-INFRASTRUCTURE
  - id: event-bus
    name: Event bus
    layer: infrastructure
    description: the only bus implementation
    rules:
      - EVENT-AFTER-COMMIT
  - id: decorator
    name: Decorator (cross-cutting concern)
    layer: infrastructure
    description: tracking layered on any bus; neither the bus nor the handlers know
    rules:
      - ARCH-INFRASTRUCTURE
  - id: unit-of-work
    name: Unit of work
    layer: infrastructure
    description: ''
    rules:
      - EVENT-AFTER-COMMIT
  - id: the-database
    name: The "database"
    layer: infrastructure
    description: a `Map`; the ports are what a real adapter would implement
    rules:
      - ARCH-INFRASTRUCTURE
  - id: controller
    name: >-
      Controller (commands → `202 { operationId }`, queries → sync; one `refuse()` per controller: `403` not
      allowed, `404` not found, `400` otherwise, always `{ message }`)
    layer: presentation
    description: ''
    rules:
      - ARCH-PRESENTATION
      - DOMAIN-RESULT
  - id: routes-and-json-schemas
    name: Routes and JSON schemas
    layer: presentation
    description: ''
    rules:
      - ARCH-PRESENTATION
  - id: authentication-middleware
    name: Authentication middleware
    layer: presentation
    description: ''
    rules:
      - ARCH-PRESENTATION
  - id: presenters
    name: Presenters (one use case, several formats)
    layer: presentation
    description: ''
    rules:
      - ARCH-PRESENTATION
  - id: composition-root
    name: Composition root
    layer: presentation
    description: ''
    rules:
      - ARCH-WIRING
      - ARCH-MODULES-DATA
# The strategic concepts: shown by the domain map (domain.yaml) and by the decisions, not by a file of
# one language, so they are the root README's strategic view rather than rows of the concept × language
# map. `where` says where each is in this repository, in Markdown; it names the map or a decision.
strategic:
  - id: bounded-context
    name: Bounded context
    description: >-
      a boundary inside which the words have one meaning and one model; here a directory with its four layers
      and its wiring file, declared in every binding
    where: '`contexts` of [`domain.yaml`](conventions/domain.yaml): a purpose and a language each'
    references: [docs/adr/0019-the-domain-is-data.md]
  - id: subdomain
    name: Subdomain
    description: >-
      a part of the business, core (what the application is for, modelled with care), supporting (what the core
      needs and nobody competes on) or generic (what every application needs); the kind says where care goes
    where: '`subdomains` of [`domain.yaml`](conventions/domain.yaml), each with its kind and the reason for it'
    references: [docs/adr/0019-the-domain-is-data.md]
  - id: ubiquitous-language
    name: Ubiquitous language
    description: >-
      the words a context speaks, used in its code, its tests, its routes and its conversations alike; the same
      word in two contexts (an account, a recipient) is two words
    where: '`language` of each context in [`domain.yaml`](conventions/domain.yaml), rendered above'
    references: [docs/adr/0019-the-domain-is-data.md]
  - id: context-map
    name: Context map
    description: >-
      every relationship between two contexts, upstream first, with the pattern on each side and the mechanism
      that carries it; the contracts it carries are read from the code, and the check holds the two to each other
    where: '`relationships` of [`domain.yaml`](conventions/domain.yaml), the diagram and the table above'
    references: [docs/adr/0019-the-domain-is-data.md]
  - id: published-language
    name: Published language
    description: >-
      the upstream publishes its facts in a contract written in its public words, for any consumer; here an
      integration event in the shared kernel, named for the fact (`NoteShared`)
    where: the integration-event relationships of the map; [ADR 6](docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md)
    references: [docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md]
  - id: customer-supplier
    name: Customer–supplier
    description: >-
      the downstream is a customer with a question the upstream serves; here a port the asking context owns, in
      its own words, answered by an adapter over the other context's read model
    where: the owned-port relationships of the map; [ADR 6](docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md)
    references: [docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md]
  - id: anti-corruption-layer-strategic
    name: Anti-corruption layer
    description: >-
      the downstream translates the upstream's model into its own at the boundary, so that a change upstream
      touches one file here; the handler of an integration event, the adapter of an owned port
    where: the downstream side of every relationship of the map; the application row of the map below names the files
    references: [docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md]
  - id: shared-kernel-strategic
    name: Shared kernel
    description: >-
      what every context agrees on and changes together: vocabulary, not mechanics; declared once, not as a
      relationship between pairs
    where: '`sharedKernel` of [`domain.yaml`](conventions/domain.yaml)'
    references: [docs/adr/0019-the-domain-is-data.md]

vocabulary:
  - word: Building blocks
    meaning: >-
      the mechanics every context is written with (Entity, AggregateRoot, ValueObject, Result, the handlers,
      the bus); they know no context and no vocabulary, not even the roles
  - word: Shared kernel
    meaning: >-
      the part of the domain model every context agrees on — Email, Role, who counts as signed in, and the
      integration events; not the base classes, which is what the word is often misused for
  - word: Bounded context
    meaning: >-
      a folder with its own vocabulary and wiring, talking to others through integration events and ports it
      owns only; its purpose, its language and its relationships are in the domain map
  - word: Aggregate (root)
    meaning: >-
      the object that owns a consistency boundary: every change goes through one of its behaviours, which
      checks the invariants and records an event
  - word: Entity
    meaning: an object with an identity that outlives its attributes
  - word: Value object
    meaning: an object without identity, compared by value, valid from the moment it exists
  - word: Invariant
    meaning: a rule that must hold after every change of an aggregate
  - word: Domain event
    meaning: a fact, in the past tense, recorded by an aggregate for the rest of the system
  - word: Integration event
    meaning: a fact restated as a published contract for other contexts
  - word: Command
    meaning: a request that something happen; one handler; may be refused
  - word: Query
    meaning: a question; answered from a read model; changes nothing
  - word: Read model
    meaning: a shape built for reading, not an aggregate
  - word: Projection
    meaning: a read model fed by events
  - word: Port
    meaning: an interface the domain or the application declares in its own words, for something outside
  - word: Adapter
    meaning: the implementation of a port, in the infrastructure
  - word: Repository
    meaning: the port that loads and saves one aggregate by identity
  - word: Domain service
    meaning: a business rule that spans several aggregates or needs a port
  - word: Application service
    meaning: orchestration shared by several entry points; no rule of its own
  - word: Anti-corruption layer
    meaning: the handler that translates a foreign contract into local terms
  - word: Snapshot
    meaning: the plain shape of an aggregate that crosses to the infrastructure
  - word: Operation
    meaning: >-
      the handle a client gets for a command: its status and outcome. The Tracker records one for every
      message on the bus, events included, so a trace shows what a command set off
  - word: Composition root
    meaning: the one file that knows every context and builds the application
