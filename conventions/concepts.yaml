# The architectural vocabulary of this repository, as data: every concept the README teaches, with
# the canonical file that shows it, the rules that govern it and the decisions that explain it.
# This is the source of the README's map tables (rendered between the "generated from
# conventions/concepts.yaml" markers by `yarn conventions:write`) and of `yarn architecture concept <id>`.
#
# One canonical example per concept. `canonical` and `examples` are checked to exist; `rules` must
# name ids from architecture.yaml; `references` are ADRs. `example` and `description` are Markdown,
# written for the README; a tool reads the structured fields. When a concept already has its file,
# point to it: do not add a second example.
schemaVersion: 1
concepts:
  - id: entity
    name: Entity
    layer: domain
    canonical:
      - src/Architecture/Domain/Entity.ts
    example: '[`Entity.ts`](src/Architecture/Domain/Entity.ts)'
    description: identity, `equals()`
    rules: []
  - id: aggregate-root
    name: Aggregate root
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Note.ts
      - src/Architecture/Domain/AggregateRoot.ts
    example: >-
      [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts) on
      [`AggregateRoot.ts`](src/Architecture/Domain/AggregateRoot.ts)
    description: >-
      behaviours enforce invariants and `record()` events; also
      [`Account.ts`](src/Contexts/Security/Domain/Account/Account.ts),
      [`Notification.ts`](src/Contexts/Notifications/Domain/Notification/Notification.ts)
    examples:
      - src/Contexts/Security/Domain/Account/Account.ts
      - src/Contexts/Notifications/Domain/Notification/Notification.ts
    rules:
      - DOMAIN-RECORDS-EVENTS
      - CONC-OPTIMISTIC
  - id: entity-inside-an-aggregate
    name: '**Entity inside an aggregate** (not a root)'
    layer: domain
    canonical:
      - src/Contexts/Notifications/Domain/Notification/DeliveryAttempt.ts
    example: '[`DeliveryAttempt.ts`](src/Contexts/Notifications/Domain/Notification/DeliveryAttempt.ts)'
    description: >-
      has its own identity, exists only inside `Notification`, reached and persisted through it. The
      criterion: few, consistent with the root in the same change, written through the root. What grows
      without bound or is written by others is its own aggregate (comments on a note)
    rules:
      - DOMAIN-RECORDS-EVENTS
  - id: value-object
    name: Value object
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/NoteTitle.ts
      - src/SharedKernel/Domain/Email.ts
      - src/Contexts/Security/Domain/Account/Credentials.ts
    example: >-
      [`NoteTitle.ts`](src/Contexts/Notes/Domain/Note/NoteTitle.ts),
      [`Email.ts`](src/SharedKernel/Domain/Email.ts),
      [`Credentials.ts`](src/Contexts/Security/Domain/Account/Credentials.ts)
    description: built through `create()` → `Result`; never invalid once you hold one
    rules:
      - DOMAIN-RESULT
  - id: identity
    name: Identity
    layer: domain
    canonical:
      - src/Architecture/Domain/Id.ts
    example: '[`Id.ts`](src/Architecture/Domain/Id.ts)'
    description: >-
      generated by the domain (`Id.generate()`), not by the database — [ADR
      2](docs/adr/0002-identity-is-generated-by-the-domain.md)
    rules:
      - DOMAIN-IDENTITY
    references:
      - docs/adr/0002-identity-is-generated-by-the-domain.md
  - id: factory
    name: Factory
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Note.ts
    example: '`Note.create()` in [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
    description: >-
      the aggregate is its own factory: a static `create()` that validates, generates the identity and records
      the creation event; the constructor is private. When creation needs a collaborator (a port), the factory
      is a domain service:
      [`AccountRegistration.ts`](src/Contexts/Security/Domain/Account/AccountRegistration.ts). No `Factory`
      class
    examples:
      - src/Contexts/Security/Domain/Account/AccountRegistration.ts
    rules:
      - DOMAIN-CREATE-VS-RECONSTITUTE
      - DOMAIN-IDENTITY
  - id: invariant
    name: Invariant
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Note.ts
    example: '`shareWith()` in [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
    description: >-
      a rule that must hold after every change (only the owner, not archived, not twice, not with yourself):
      checked inside the behaviour, before the state changes and the event is recorded. There is no
      `validate()` to forget, and no way to reach the state but through the behaviour
    rules:
      - DOMAIN-RESULT
  - id: creation-vs-reconstitution
    name: Creation vs reconstitution
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Note.ts
    example: '`Note.create()` vs `Note.fromSnapshot()` in [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
    description: >-
      creation records an event; rebuilding from persistence records nothing — [ADR
      4](docs/adr/0004-reconstitution-throws-on-corrupted-data.md)
    rules:
      - DOMAIN-CREATE-VS-RECONSTITUTE
    references:
      - docs/adr/0004-reconstitution-throws-on-corrupted-data.md
  - id: domain-event
    name: Domain event
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Events/NoteEvents.ts
    example: '[`NoteEvents.ts`](src/Contexts/Notes/Domain/Note/Events/NoteEvents.ts)'
    description: past tense, minimal payload, internal to the context
    rules:
      - DOMAIN-RECORDS-EVENTS
      - EVENT-AFTER-COMMIT
  - id: domain-exception
    name: Domain exception
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/NoteExceptions.ts
    example: '[`NoteExceptions.ts`](src/Contexts/Notes/Domain/Note/NoteExceptions.ts)'
    description: >-
      a broken rule in business words, carried by `Result.fail()`, never thrown — [ADR
      1](docs/adr/0001-result-instead-of-exceptions.md)
    rules:
      - DOMAIN-RESULT
    references:
      - docs/adr/0001-result-instead-of-exceptions.md
  - id: result
    name: '`Result`'
    layer: domain
    canonical:
      - src/Architecture/Domain/Result.ts
    example: '[`Result.ts`](src/Architecture/Domain/Result.ts)'
    description: '`IResult<T>` is the type you write in signatures'
    rules:
      - DOMAIN-RESULT
  - id: optimistic-concurrency
    name: '**Optimistic concurrency**'
    layer: domain
    canonical:
      - src/Architecture/Domain/AggregateRoot.ts
      - src/Contexts/Notes/Infrastructure/Repositories/SqliteNoteRepository.ts
      - src/Contexts/Notes/Infrastructure/Repositories/InMemoryNoteRepository.ts
    example: >-
      `AggregateRoot.version` in [`AggregateRoot.ts`](src/Architecture/Domain/AggregateRoot.ts); `save()` in
      [`SqliteNoteRepository.ts`](src/Contexts/Notes/Infrastructure/Repositories/SqliteNoteRepository.ts)
      (`UPDATE … WHERE version = ?`) and
      [`InMemoryNoteRepository.ts`](src/Contexts/Notes/Infrastructure/Repositories/InMemoryNoteRepository.ts)
    description: >-
      the aggregate carries the version it was read at and never changes it; the repository stores version + 1
      and refuses a stale one with `ConcurrencyConflict`, so of two writers who read the same version only the
      first wins — [ADR 8](docs/adr/0008-optimistic-concurrency-on-the-aggregate.md)
    rules:
      - CONC-OPTIMISTIC
    references:
      - docs/adr/0008-optimistic-concurrency-on-the-aggregate.md
  - id: repository-port
    name: Repository port
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Ports/INoteRepository.ts
    example: '[`INoteRepository.ts`](src/Contexts/Notes/Domain/Note/Ports/INoteRepository.ts)'
    description: load / save an aggregate; nothing else
    rules:
      - QUERY-READ-MODELS
      - CONC-OPTIMISTIC
      - ARCH-DOMAIN
  - id: queries-port-read-models
    name: Queries port & read models
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Ports/INoteQueries.ts
    example: '[`INoteQueries.ts`](src/Contexts/Notes/Domain/Note/Ports/INoteQueries.ts)'
    description: >-
      returns view shapes, never aggregates — [ADR
      5](docs/adr/0005-queries-return-read-models-not-aggregates.md)
    rules:
      - QUERY-READ-MODELS
    references:
      - docs/adr/0005-queries-return-read-models-not-aggregates.md
  - id: snapshot-dto
    name: Snapshot DTO
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/DTOs.ts
    example: '[`DTOs.ts`](src/Contexts/Notes/Domain/Note/DTOs.ts)'
    description: the plain shape that crosses to the infrastructure
    rules:
      - DOMAIN-CREATE-VS-RECONSTITUTE
  - id: domain-service
    name: '**Domain service**'
    layer: domain
    canonical:
      - src/Contexts/Security/Domain/Account/AccountRegistration.ts
    example: '[`AccountRegistration.ts`](src/Contexts/Security/Domain/Account/AccountRegistration.ts)'
    description: a rule about the whole collection ("one account per email") — needs the port, still pure domain
    rules:
      - ARCH-DOMAIN
  - id: port-to-another-context
    name: '**Port to another context** (read side)'
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/Ports/IAccountDirectory.ts
      - src/Contexts/Notes/Domain/Note/NoteSharing.ts
      - src/Contexts/Notes/Infrastructure/Directories/SecurityAccountDirectory.ts
    example: >-
      [`IAccountDirectory.ts`](src/Contexts/Notes/Domain/Note/Ports/IAccountDirectory.ts), used by
      [`NoteSharing.ts`](src/Contexts/Notes/Domain/Note/NoteSharing.ts), answered by
      [`SecurityAccountDirectory.ts`](src/Contexts/Notes/Infrastructure/Directories/SecurityAccountDirectory.ts)
    description: >-
      Notes asks "does this account exist?" in its own words; only its infrastructure knows Security is next
      door. The read-side counterpart of the anti-corruption layer for events
    rules:
      - CTX-CONTRACTS
      - ARCH-INFRASTRUCTURE
  - id: ports-for-technical-concerns
    name: Ports for technical concerns
    layer: domain
    canonical:
      - src/Contexts/Security/Domain/Auth/Ports/IPasswordHasher.ts
      - src/Contexts/Security/Domain/Auth/Ports/ISignedTokens.ts
    example: >-
      [`IPasswordHasher.ts`](src/Contexts/Security/Domain/Auth/Ports/IPasswordHasher.ts),
      [`ISignedTokens.ts`](src/Contexts/Security/Domain/Auth/Ports/ISignedTokens.ts)
    description: hashing has a business meaning; the algorithm does not belong here
    rules:
      - ARCH-DOMAIN
      - DOMAIN-NON-DETERMINISM
  - id: lifecycle-as-an-enum
    name: Lifecycle as an enum
    layer: domain
    canonical:
      - src/Contexts/Notes/Domain/Note/NoteStatus.ts
      - src/Contexts/Security/Domain/Account/AccountStatus.ts
    example: >-
      [`NoteStatus.ts`](src/Contexts/Notes/Domain/Note/NoteStatus.ts),
      [`AccountStatus.ts`](src/Contexts/Security/Domain/Account/AccountStatus.ts)
    description: the transitions live in the aggregate, not in the enum
    rules: []
  - id: command
    name: Command
    layer: application
    canonical:
      - src/Contexts/Notes/Application/Commands/ShareNote/ShareNoteCommandEvent.ts
    example: '[`ShareNoteCommandEvent.ts`](src/Contexts/Notes/Application/Commands/ShareNote/ShareNoteCommandEvent.ts)'
    description: >-
      a named payload, nothing more. It extends `CommandEvent`, one of the three kinds of message in
      [`EventTypes.ts`](src/Architecture/Domain/EventTypes.ts): a command travels on the same bus as the
      events and is tracked as an operation, so it has their shape; the class says its intent (one handler,
      may be refused)
    examples:
      - src/Architecture/Domain/EventTypes.ts
    rules:
      - ARCH-APPLICATION
  - id: command-handler
    name: Command handler
    layer: application
    canonical:
      - src/Contexts/Notes/Application/Commands/EditNote/EditNoteCommandHandler.ts
    example: '[`EditNoteCommandHandler.ts`](src/Contexts/Notes/Application/Commands/EditNote/EditNoteCommandHandler.ts)'
    description: the shape every "change an existing thing" use case follows
    rules:
      - DOMAIN-RESULT
      - EVENT-AFTER-COMMIT
  - id: guard
    name: Guard (authorization)
    layer: application
    canonical:
      - src/SharedKernel/Application/Guards.ts
      - src/Contexts/Security/Application/Commands/RegisterAdmin/RegisterAdminCommandHandler.ts
    example: >-
      `requireSignedIn()` in [`Guards.ts`](src/SharedKernel/Application/Guards.ts), called once at the top of
      `execute()`; `guard()` in
      [`RegisterAdminCommandHandler.ts`](src/Contexts/Security/Application/Commands/RegisterAdmin/RegisterAdminCommandHandler.ts)
      for role-only rules
    description: '*who may call* is answered here; *what they may do to which object* is the aggregate''s business'
    rules:
      - DOMAIN-RESULT
  - id: application-service
    name: Application service
    layer: application
    canonical:
      - src/Contexts/Notifications/Application/Services/NotificationDelivery.ts
    example: '[`NotificationDelivery.ts`](src/Contexts/Notifications/Application/Services/NotificationDelivery.ts)'
    description: orchestrates ports for a use case several entry points share; holds no rule of its own
    rules:
      - ARCH-APPLICATION
  - id: base-handler
    name: Base handler (guard, transaction, safety net)
    layer: application
    canonical:
      - src/Architecture/Application/CommandHandler.ts
    example: '[`CommandHandler.ts`](src/Architecture/Application/CommandHandler.ts)'
    description: a concrete handler only writes `execute()`
    rules:
      - DOMAIN-RESULT
      - EVENT-AFTER-COMMIT
  - id: query-handler
    name: Query handler
    layer: application
    canonical:
      - src/Contexts/Notes/Application/Queries/GetNote/GetNoteQueryHandler.ts
    example: '[`GetNoteQueryHandler.ts`](src/Contexts/Notes/Application/Queries/GetNote/GetNoteQueryHandler.ts)'
    description: reads through the queries port; a refused query is a failed `Result`, not a throw
    rules:
      - QUERY-READ-MODELS
  - id: execution-context
    name: Execution context
    layer: application
    canonical:
      - src/Architecture/Application/ExecutionContext.ts
    example: '[`ExecutionContext.ts`](src/Architecture/Application/ExecutionContext.ts)'
    description: who is calling, with which logger, bus and unit of work; `withTransaction`, `afterCommit`
    rules:
      - ARCH-EXECUTION-CONTEXT
      - EVENT-AFTER-COMMIT
  - id: publish-after-commit
    name: Publish after commit
    layer: application
    canonical:
      - src/Architecture/Application/CommandHandler.ts
    example: '`publishDomainEvents()` in [`CommandHandler.ts`](src/Architecture/Application/CommandHandler.ts)'
    description: '[ADR 3](docs/adr/0003-publish-domain-events-after-commit.md)'
    rules:
      - EVENT-AFTER-COMMIT
    references:
      - docs/adr/0003-publish-domain-events-after-commit.md
  - id: domain-event-handler
    name: Domain event handler
    layer: application
    canonical:
      - src/Contexts/Notes/Application/Events/NoteSharedHandler.ts
    example: '[`NoteSharedHandler.ts`](src/Contexts/Notes/Application/Events/NoteSharedHandler.ts)'
    description: where a fact leaves its context
    rules:
      - CTX-CONTRACTS
  - id: integration-event
    name: Integration event (published contract)
    layer: application
    canonical:
      - src/SharedKernel/Application/IntegrationEvents/NoteIntegrationEvents.ts
    example: '[`NoteIntegrationEvents.ts`](src/SharedKernel/Application/IntegrationEvents/NoteIntegrationEvents.ts)'
    description: >-
      the only thing one context may know about another — [ADR
      6](docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md)
    rules:
      - CTX-CONTRACTS
    references:
      - docs/adr/0006-integration-events-and-owned-ports-are-the-contracts-between-contexts.md
  - id: anti-corruption-layer
    name: '**Anti-corruption layer**'
    layer: application
    canonical:
      - src/Contexts/Notifications/Application/Events/NoteSharedIntegrationEventHandler.ts
    example: '[`NoteSharedIntegrationEventHandler.ts`](src/Contexts/Notifications/Application/Events/NoteSharedIntegrationEventHandler.ts)'
    description: restates a foreign fact in local terms
    rules:
      - CTX-CONTRACTS
  - id: projection-read-model
    name: '**Projection / read model**'
    layer: application
    canonical:
      - src/Contexts/Tracker/Application/Projections/OperationProjection.ts
      - src/Contexts/Tracker/Application/ReadModel/OperationRecord.ts
    example: >-
      [`OperationProjection.ts`](src/Contexts/Tracker/Application/Projections/OperationProjection.ts),
      [`OperationRecord.ts`](src/Contexts/Tracker/Application/ReadModel/OperationRecord.ts)
    description: a context with no aggregate at all
    rules:
      - QUERY-READ-MODELS
  - id: non-determinism-as-a-value
    name: '**Non-determinism as a value** (ADR 7)'
    layer: application
    canonical:
      - src/Contexts/Notes/Application/Suggestions/INoteTitleSuggestions.ts
      - src/Contexts/Notes/Application/Commands/SuggestNoteTitle/SuggestNoteTitleCommandHandler.ts
      - src/Contexts/Notes/Infrastructure/Suggestions/FirstLineTitleSuggestions.ts
    example: >-
      [`INoteTitleSuggestions.ts`](src/Contexts/Notes/Application/Suggestions/INoteTitleSuggestions.ts) →
      [`SuggestNoteTitleCommandHandler.ts`](src/Contexts/Notes/Application/Commands/SuggestNoteTitle/SuggestNoteTitleCommandHandler.ts),
      answered locally by
      [`FirstLineTitleSuggestions.ts`](src/Contexts/Notes/Infrastructure/Suggestions/FirstLineTitleSuggestions.ts)
    description: >-
      a decision the domain cannot make from its own state (a model, a heuristic, a person) enters it as a
      value the aggregate validates and may refuse; the provenance travels with it and ends on the operation —
      [ADR 7](docs/adr/0007-non-determinism-enters-the-domain-as-a-value.md)
    rules:
      - DOMAIN-NON-DETERMINISM
    references:
      - docs/adr/0007-non-determinism-enters-the-domain-as-a-value.md
  - id: module
    name: Module (wiring)
    layer: application
    canonical:
      - src/Architecture/Application/Module.ts
      - src/Contexts/Notes/module.local.ts
    example: >-
      [`Module.ts`](src/Architecture/Application/Module.ts), used in
      [`Notes/module.local.ts`](src/Contexts/Notes/module.local.ts)
    description: 'plain data: which handler answers which command, query, event'
    rules:
      - ARCH-MODULES-DATA
      - ARCH-WIRING
  - id: repository-implementation
    name: Repository implementation
    layer: infrastructure
    canonical:
      - src/Contexts/Notes/Infrastructure/Repositories/InMemoryNoteRepository.ts
    example: '[`InMemoryNoteRepository.ts`](src/Contexts/Notes/Infrastructure/Repositories/InMemoryNoteRepository.ts)'
    description: snapshot in, snapshot out
    rules:
