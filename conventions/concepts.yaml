# Every concept the README teaches, with the canonical file that shows it. This is the source of
# the README's map tables (rendered between the "generated from conventions/concepts.yaml" markers
# by `yarn conventions:write`) and the reading list an agent or a newcomer starts from.
#
# One canonical example per concept. Cells are Markdown; every `](path)` link is checked to exist
# by `yarn check:conventions`. When a concept already has its file, point to it: do not add a
# second example.
sections:
  - id: domain
    heading: Domain layer
    columns:
      concept: Concept
      example: Canonical example
      notes: Notes
    rows:
      - concept: Entity
        example: '[`Entity.ts`](src/Contexts/@SharedKernel/Domain/DDD/Entity.ts)'
        notes: identity, `equals()`
      - concept: Aggregate root
        example: >-
          [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts) on
          [`AggregateRoot.ts`](src/Contexts/@SharedKernel/Domain/DDD/AggregateRoot.ts)
        notes: >-
          behaviours enforce invariants and `record()` events; also
          [`Account.ts`](src/Contexts/Security/Domain/Account/Account.ts),
          [`Notification.ts`](src/Contexts/Notifications/Domain/Notification/Notification.ts)
      - concept: '**Entity inside an aggregate** (not a root)'
        example: '[`DeliveryAttempt.ts`](src/Contexts/Notifications/Domain/Notification/DeliveryAttempt.ts)'
        notes: has its own identity, exists only inside `Notification`, reached and persisted through it
      - concept: Value object
        example: >-
          [`NoteTitle.ts`](src/Contexts/Notes/Domain/Note/NoteTitle.ts),
          [`Email.ts`](src/Contexts/@SharedKernel/Domain/ValueObjects/Email.ts),
          [`Credentials.ts`](src/Contexts/Security/Domain/Account/Credentials.ts)
        notes: built through `create()` → `Result`; never invalid once you hold one
      - concept: Identity
        example: '[`Id.ts`](src/Contexts/@SharedKernel/Domain/ValueObjects/Id.ts)'
        notes: >-
          generated by the domain (`Id.generate()`), not by the database — [ADR
          2](docs/adr/0002-identity-is-generated-by-the-domain.md)
      - concept: Factory
        example: '`Note.create()` in [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
        notes: >-
          the aggregate is its own factory: a static `create()` that validates, generates the identity and
          records the creation event; the constructor is private. When creation needs a collaborator (a port),
          the factory is a domain service:
          [`AccountRegistration.ts`](src/Contexts/Security/Domain/Account/AccountRegistration.ts). No
          `Factory` class
      - concept: Invariant
        example: '`shareWith()` in [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
        notes: >-
          a rule that must hold after every change (only the owner, not archived, not twice, not with
          yourself): checked inside the behaviour, before the state changes and the event is recorded. There
          is no `validate()` to forget, and no way to reach the state but through the behaviour
      - concept: Creation vs reconstitution
        example: '`Note.create()` vs `Note.fromSnapshot()` in [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
        notes: >-
          creation records an event; rebuilding from persistence records nothing — [ADR
          4](docs/adr/0004-reconstitution-throws-on-corrupted-data.md)
      - concept: Domain event
        example: '[`NoteEvents.ts`](src/Contexts/Notes/Domain/Note/Events/NoteEvents.ts)'
        notes: past tense, minimal payload, internal to the context
      - concept: Domain exception
        example: '[`NoteExceptions.ts`](src/Contexts/Notes/Domain/Note/NoteExceptions.ts)'
        notes: >-
          a broken rule in business words, carried by `Result.fail()`, never thrown — [ADR
          1](docs/adr/0001-result-instead-of-exceptions.md)
      - concept: '`Result`'
        example: '[`Result.ts`](src/Contexts/@SharedKernel/Domain/DDD/Result.ts)'
        notes: '`IResult<T>` is the type you write in signatures'
      - concept: Repository port
        example: '[`INoteRepository.ts`](src/Contexts/Notes/Domain/Note/Ports/INoteRepository.ts)'
        notes: load / save an aggregate; nothing else
      - concept: Queries port & read models
        example: '[`INoteQueries.ts`](src/Contexts/Notes/Domain/Note/Ports/INoteQueries.ts)'
        notes: >-
          returns view shapes, never aggregates — [ADR
          5](docs/adr/0005-queries-return-read-models-not-aggregates.md)
      - concept: Snapshot DTO
        example: '[`DTOs.ts`](src/Contexts/Notes/Domain/Note/DTOs.ts)'
        notes: the plain shape that crosses to the infrastructure
      - concept: '**Domain service**'
        example: '[`AccountRegistration.ts`](src/Contexts/Security/Domain/Account/AccountRegistration.ts)'
        notes: a rule about the whole collection ("one account per email") — needs the port, still pure domain
      - concept: '**Port to another context** (read side)'
        example: >-
          [`IAccountDirectory.ts`](src/Contexts/Notes/Domain/Note/Ports/IAccountDirectory.ts), used by
          [`NoteSharing.ts`](src/Contexts/Notes/Domain/Note/NoteSharing.ts), answered by
          [`SecurityAccountDirectory.ts`](src/Contexts/Notes/Infrastructure/Directories/SecurityAccountDirectory.ts)
        notes: >-
          Notes asks "does this account exist?" in its own words; only its infrastructure knows Security is
          next door. The read-side counterpart of the anti-corruption layer for events
      - concept: Ports for technical concerns
        example: >-
          [`IPasswordHasher.ts`](src/Contexts/Security/Domain/Auth/Ports/IPasswordHasher.ts),
          [`IJwtService.ts`](src/Contexts/Security/Domain/Auth/Ports/IJwtService.ts)
        notes: hashing has a business meaning; the algorithm does not belong here
      - concept: Lifecycle as an enum
        example: >-
          [`NoteStatus.ts`](src/Contexts/Notes/Domain/Note/NoteStatus.ts),
          [`AccountStatus.ts`](src/Contexts/Security/Domain/Account/AccountStatus.ts)
        notes: the transitions live in the aggregate, not in the enum
  - id: application
    heading: Application layer
    columns:
      concept: Concept
      example: Canonical example
      notes: Notes
    rows:
      - concept: Command
        example: '[`ShareNoteCommandEvent.ts`](src/Contexts/Notes/Application/Commands/ShareNote/ShareNoteCommandEvent.ts)'
        notes: >-
          a named payload, nothing more. It extends `CommandEvent`, one of the three kinds of message in
          [`EventTypes.ts`](src/Contexts/@SharedKernel/Domain/DDD/EventTypes.ts): a command travels on the
          same bus as the events and is tracked as an operation, so it has their shape; the class says its
          intent (one handler, may be refused)
      - concept: Command handler
        example: '[`EditNoteCommandHandler.ts`](src/Contexts/Notes/Application/Commands/EditNote/EditNoteCommandHandler.ts)'
        notes: the shape every "change an existing thing" use case follows
      - concept: Guard (authorization)
        example: >-
          `requireSignedIn()` in [`Guards.ts`](src/Contexts/@SharedKernel/Application/Guards.ts), called once
          at the top of `execute()`; `guard()` in
          [`RegisterAdminCommandHandler.ts`](src/Contexts/Security/Application/Commands/RegisterAdmin/RegisterAdminCommandHandler.ts)
          for role-only rules
        notes: '*who may call* is answered here; *what they may do to which object* is the aggregate''s business'
      - concept: Application service
        example: '[`NotificationDelivery.ts`](src/Contexts/Notifications/Application/Services/NotificationDelivery.ts)'
        notes: orchestrates ports for a use case several entry points share; holds no rule of its own
      - concept: Base handler (guard, transaction, safety net)
        example: '[`CommandHandler.ts`](src/Contexts/@SharedKernel/Application/CommandHandler.ts)'
        notes: a concrete handler only writes `execute()`
      - concept: Query handler
        example: '[`GetNoteQueryHandler.ts`](src/Contexts/Notes/Application/Queries/GetNote/GetNoteQueryHandler.ts)'
        notes: reads through the queries port; a refused query is a failed `Result`, not a throw
      - concept: Execution context
        example: '[`ExecutionContext.ts`](src/Contexts/@SharedKernel/Application/ExecutionContext.ts)'
        notes: who is calling, with which logger, bus and unit of work; `withTransaction`, `afterCommit`
      - concept: Publish after commit
        example: >-
          `publishDomainEvents()` in
          [`CommandHandler.ts`](src/Contexts/@SharedKernel/Application/CommandHandler.ts)
        notes: '[ADR 3](docs/adr/0003-publish-domain-events-after-commit.md)'
      - concept: Domain event handler
        example: '[`NoteSharedHandler.ts`](src/Contexts/Notes/Application/Events/NoteSharedHandler.ts)'
        notes: where a fact leaves its context
      - concept: Integration event (published contract)
        example: '[`NoteIntegrationEvents.ts`](src/Contexts/@SharedKernel/Application/IntegrationEvents/NoteIntegrationEvents.ts)'
        notes: >-
          the only thing one context may know about another — [ADR
          6](docs/adr/0006-integration-events-are-the-only-contract-between-contexts.md)
      - concept: '**Anti-corruption layer**'
        example: '[`NoteSharedIntegrationEventHandler.ts`](src/Contexts/Notifications/Application/Events/NoteSharedIntegrationEventHandler.ts)'
        notes: restates a foreign fact in local terms
      - concept: '**Projection / read model**'
        example: >-
          [`OperationProjection.ts`](src/Contexts/Tracker/Application/Projections/OperationProjection.ts),
          [`OperationRecord.ts`](src/Contexts/Tracker/Application/ReadModel/OperationRecord.ts)
        notes: a context with no aggregate at all
      - concept: Module (wiring)
        example: >-
          [`Module.ts`](src/Contexts/@SharedKernel/Application/Module.ts), used in
          [`Notes/module.local.ts`](src/Contexts/Notes/module.local.ts)
        notes: 'plain data: which handler answers which command, query, event'
  - id: infrastructure
    heading: Infrastructure layer
    columns:
      concept: Concept
      example: Canonical example
      notes: Notes
    rows:
      - concept: Repository implementation
        example: '[`InMemoryNoteRepository.ts`](src/Contexts/Notes/Infrastructure/Repositories/InMemoryNoteRepository.ts)'
        notes: snapshot in, snapshot out
      - concept: Queries implementation
        example: '[`InMemoryNoteQueries.ts`](src/Contexts/Notes/Infrastructure/Queries/InMemoryNoteQueries.ts)'
        notes: builds read models from the same store, here
      - concept: Port implementations
        example: >-
          [`JwtService.ts`](src/Contexts/Security/Infrastructure/Services/JwtService.ts) (`jose`),
          [`BcryptPasswordHasher.ts`](src/Contexts/Security/Infrastructure/Services/BcryptPasswordHasher.ts)
      - concept: Event bus
        example: '[`InMemoryEventBus.ts`](src/Contexts/@SharedKernel/Infrastructure/EventBus/InMemoryEventBus.ts)'
        notes: the only bus implementation
      - concept: Decorator (cross-cutting concern)
        example: '[`TrackedEventBus.ts`](src/Contexts/Tracker/Infrastructure/TrackedEventBus.ts)'
        notes: tracking layered on any bus; neither the bus nor the handlers know
      - concept: Unit of work
        example: '[`InMemoryUnitOfWork.ts`](src/Contexts/@SharedKernel/Infrastructure/UnitOfWork/InMemoryUnitOfWork.ts)'
      - concept: The "database"
        example: '[`InMemoryDataSource.ts`](src/Contexts/@SharedKernel/Infrastructure/DataSources/InMemoryDataSource.ts)'
        notes: a `Map`; the ports are what a real adapter would implement
  - id: presentation
    heading: Presentation and bootstrap
    columns:
      concept: Concept
      example: Canonical example
    rows:
      - concept: >-
          Controller (commands → `202 { operationId }`, queries → sync; one `refuse()` per controller: `403`
          not allowed, `404` not found, `400` otherwise, always `{ message }`)
        example: >-
          [`FastifyNoteController.ts`](src/Contexts/Notes/Presentation/API/REST/Controllers/FastifyNoteController.ts);
          every other controller has the same shape
      - concept: Routes and JSON schemas
        example: >-
          [`note.routes.ts`](src/Contexts/Notes/Presentation/API/REST/Routes/note.routes.ts),
          [`note.routes.schema.ts`](src/Contexts/Notes/Presentation/API/REST/Routes/note.routes.schema.ts)
      - concept: Authentication middleware
        example: >-
          [`FastifyJWTAuthenticationMiddleware.ts`](src/Contexts/Security/Presentation/API/REST/Middlewares/FastifyJWTAuthenticationMiddleware.ts)
          — never blocks, makes the caller `GUEST` unless the token verifies
      - concept: Presenters (one use case, several formats)
        example: >-
          [`Security/Presentation/Presenters/Auth`](src/Contexts/Security/Presentation/Presenters/Auth),
          picked per request by [`Format.ts`](src/Contexts/@SharedKernel/Presentation/Format.ts) — a plain
          object per controller, no registry
      - concept: Composition root
        example: >-
          [`createApplication.ts`](src/Bootstrap/Fastify/createApplication.ts) on
          [`Application.ts`](src/Contexts/@SharedKernel/Application/Application.ts): wires, starts the
          modules, seeds the administrator through the same bus as any command, then listens;
          [`application.ts`](src/Bootstrap/Fastify/application.ts) is the process entry point
  - id: tests
    heading: Tests, one style per layer
    columns:
      layer: Layer
      example: Example
      doubles: Doubles
    rows:
      - layer: Domain
        example: '[`Note.spec.ts`](src/Contexts/Notes/Domain/Note/Note.spec.ts)'
        doubles: none
      - layer: Domain service
        example: '[`AccountRegistration.spec.ts`](src/Contexts/Security/Domain/Account/AccountRegistration.spec.ts)'
        doubles: a 10-line fake of the port
      - layer: Application
        example: '[`NoteCommandHandlers.spec.ts`](src/Contexts/Notes/Application/Commands/NoteCommandHandlers.spec.ts)'
        doubles: the in-memory repository *is* the double
      - layer: Infrastructure
        example: >-
          [`TrackedEventBus.spec.ts`](src/Contexts/Tracker/Infrastructure/TrackedEventBus.spec.ts),
          [`JwtService.spec.ts`](src/Contexts/Security/Infrastructure/Services/JwtService.spec.ts)
        doubles: real in-memory pieces
      - layer: End to end
        example: '[`note.routes.e2e.spec.ts`](src/Contexts/Notes/Presentation/API/REST/Routes/note.routes.e2e.spec.ts)'
        doubles: >-
          the whole application, booted in-process by
          [`application.spec-helper.ts`](src/Bootstrap/Fastify/application.spec-helper.ts), spoken to over
          HTTP
  - id: vocabulary
    heading: Vocabulary
    columns:
      word: Word
      meaning: Here it means
      see: See
    rows:
      - word: Bounded context
        meaning: a folder with its own vocabulary and wiring, talking to others through integration events only
        see: '[`src/Contexts`](src/Contexts)'
      - word: Aggregate (root)
        meaning: >-
          the object that owns a consistency boundary: every change goes through one of its behaviours, which
          checks the invariants and records an event
        see: '[`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
      - word: Entity
        meaning: an object with an identity that outlives its attributes
        see: >-
          [`Entity.ts`](src/Contexts/@SharedKernel/Domain/DDD/Entity.ts),
          [`DeliveryAttempt.ts`](src/Contexts/Notifications/Domain/Notification/DeliveryAttempt.ts)
      - word: Value object
        meaning: an object without identity, compared by value, valid from the moment it exists
        see: '[`NoteTitle.ts`](src/Contexts/Notes/Domain/Note/NoteTitle.ts)'
      - word: Invariant
        meaning: a rule that must hold after every change of an aggregate
        see: '`shareWith()` in [`Note.ts`](src/Contexts/Notes/Domain/Note/Note.ts)'
      - word: Domain event
        meaning: a fact, in the past tense, recorded by an aggregate for the rest of the system
        see: '[`NoteEvents.ts`](src/Contexts/Notes/Domain/Note/Events/NoteEvents.ts)'
      - word: Integration event
        meaning: a fact restated as a published contract for other contexts
        see: '[`NoteIntegrationEvents.ts`](src/Contexts/@SharedKernel/Application/IntegrationEvents/NoteIntegrationEvents.ts)'
      - word: Command
        meaning: a request that something happen; one handler; may be refused
        see: '[`ShareNoteCommandEvent.ts`](src/Contexts/Notes/Application/Commands/ShareNote/ShareNoteCommandEvent.ts)'
      - word: Query
        meaning: a question; answered from a read model; changes nothing
        see: '[`GetNoteQueryHandler.ts`](src/Contexts/Notes/Application/Queries/GetNote/GetNoteQueryHandler.ts)'
      - word: Read model
        meaning: a shape built for reading, not an aggregate
        see: '[`INoteQueries.ts`](src/Contexts/Notes/Domain/Note/Ports/INoteQueries.ts)'
      - word: Projection
        meaning: a read model fed by events
        see: '[`OperationProjection.ts`](src/Contexts/Tracker/Application/Projections/OperationProjection.ts)'
      - word: Port
        meaning: an interface the domain or the application declares in its own words, for something outside
        see: >-
          [`INoteRepository.ts`](src/Contexts/Notes/Domain/Note/Ports/INoteRepository.ts),
          [`IAccountDirectory.ts`](src/Contexts/Notes/Domain/Note/Ports/IAccountDirectory.ts)
      - word: Adapter
        meaning: the implementation of a port, in the infrastructure
        see: >-
          [`InMemoryNoteRepository.ts`](src/Contexts/Notes/Infrastructure/Repositories/InMemoryNoteRepository.ts),
          [`SecurityAccountDirectory.ts`](src/Contexts/Notes/Infrastructure/Directories/SecurityAccountDirectory.ts)
      - word: Repository
        meaning: the port that loads and saves one aggregate by identity
        see: '[`INoteRepository.ts`](src/Contexts/Notes/Domain/Note/Ports/INoteRepository.ts)'
      - word: Domain service
        meaning: a business rule that spans several aggregates or needs a port
        see: >-
          [`AccountRegistration.ts`](src/Contexts/Security/Domain/Account/AccountRegistration.ts),
          [`NoteSharing.ts`](src/Contexts/Notes/Domain/Note/NoteSharing.ts)
      - word: Application service
        meaning: orchestration shared by several entry points; no rule of its own
        see: '[`NotificationDelivery.ts`](src/Contexts/Notifications/Application/Services/NotificationDelivery.ts)'
      - word: Anti-corruption layer
        meaning: the handler that translates a foreign contract into local terms
        see: '[`NoteSharedIntegrationEventHandler.ts`](src/Contexts/Notifications/Application/Events/NoteSharedIntegrationEventHandler.ts)'
      - word: Snapshot
        meaning: the plain shape of an aggregate that crosses to the infrastructure
        see: '[`DTOs.ts`](src/Contexts/Notes/Domain/Note/DTOs.ts)'
      - word: Operation
        meaning: 'the handle a client gets for a command: its status and outcome, recorded by the Tracker'
        see: '[`Operation.ts`](src/Contexts/@SharedKernel/Application/Operation.ts)'
      - word: Composition root
        meaning: the one file that knows every context and builds the application
        see: '[`createApplication.ts`](src/Bootstrap/Fastify/createApplication.ts)'
