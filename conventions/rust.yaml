# The Rust binding of the architecture contract: where this language keeps the trees that
# architecture.yaml reasons about, which file shows each concept of concepts.yaml, which tool holds
# each rule, and what a new thing of each kind is made of in this language's idiom. It adds no
# rule: a rule lives in architecture.yaml, under one id for every language (ARCH-ONE-CONTRACT).
#
# In Rust every layer of every tree is a crate, and a crate's `[dependencies]` are its row of the
# dependency table: the compiler holds the boundary, and `cargo run -p conventions` proves the
# graph is the table. A crate directory is the layer's name in lowercase (`domain`); a crate is
# named after its tree and its layer (`architecture-domain`, `shared-kernel-domain`, `notes-domain`).
#
# Paths are relative to `root`, the directory of this language; the loader turns them into
# repository-relative paths, so every tool, document and diff speaks the same ones. What this
# language does not show yet is simply not named here, and the root README's map shows the gap.

schemaVersion: 1
language: rust
name: Rust
root: rust

contexts: [Notes, Security, Notifications, Tracker]

# The trees. `alias` is how a tree is named in a crate name: a context's crates are named after
# the context (`notes-domain`), the two trees after themselves.
contexts_tree: { alias: '<context>', path: src/contexts }
architecture: { alias: architecture, path: src/architecture }
kernel: { alias: shared-kernel, path: src/shared_kernel }
bootstrap: { alias: bootstrap, path: src/bootstrap }
# A context's wiring is a crate of its own, `<context>-wiring`, beside its layer crates.
wiring: wiring

# Libraries only an adapter may depend on: the domain and the use cases never see them. The
# runtime is one of them (ADR 14): `tokio` appears in the Presentation and the bootstrap, nowhere below.
libraries: [axum, hyper, tower, tower-http, tokio, reqwest, sqlx, rusqlite, jsonwebtoken, bcrypt]

# What stands behind each enforcement word of architecture.yaml, in this language.
enforcers:
  linter: the crate graph — each layer is a crate whose `[dependencies]` are its row of the table, held by the compiler and compared to the contract by `cargo run -p conventions`
  check: '`cargo run -p conventions`'
  types: the compiler
  tests: a `#[test]`
  review: review (stated here, not yet mechanical)
  evaluations: fresh-agent evaluations

# The checks a change must pass before it is done; CI runs them in this order.
checks:
  - cargo run -p conventions
  - cargo fmt --check
  - cargo clippy --all-targets -- -D warnings
  - cargo test

# What the two modes protect and decide in this language, on top of the contract and the
# decisions, which architecture.yaml protects for every language.
modes:
  feature:
    protected: [src/architecture, src/shared_kernel, tools]
    # Publishing a fact is what a cross-context feature does: the contracts crate is not protected.
    allowed: [src/shared_kernel/application/src/integration_events]
  architecture:
    decides: [src/architecture, src/shared_kernel/domain]

# What `clean-ddd create --language rust` makes of this directory (ADR 10, ADR 23, ADR 27): the
# crates copied as they are (the building blocks with their tests, the shared kernel's model and
# guard, the conventions tool — a crate of the workspace — and the configuration), the module its
# integration events go in (its `mod.rs` is copied and keeps only the contracts copied with it),
# the workspace manifest rewritten with the application's name, its members narrowed to the trees
# copied and its dependencies to what the copied crates use; Cargo.lock travels whole and the next
# build settles it. The tool wants its inventory committed, so `create` writes the Tracker's lines
# of this one.
create:
  copy:
    - src/architecture
    - src/shared_kernel/domain
    - src/shared_kernel/application/Cargo.toml
    - src/shared_kernel/application/src/lib.rs
    - src/shared_kernel/application/src/guards.rs
    - src/shared_kernel/application/src/integration_events/mod.rs
    # The Tracker, which a client follows a command's 202 at, and the contract it publishes (ADR 27).
    # Its end-to-end cases are in src/bootstrap/tests/operation_routes.rs, which boots this
    # repository's four contexts, so they stay here; the starting composition's suite boots the
    # Tracker alone.
    - src/shared_kernel/application/src/integration_events/tracker_integration_events.rs
    - src/contexts/tracker
    # The transport, which knows no context, and the composition root a new application starts
    # from, with its entry point and its end-to-end suite, in place of this repository's
    # (src/bootstrap itself, which is not copied). A crate is named in its manifest, and a
    # workspace holds one crate of a name, so the starter keeps its directory and its name
    # (`bootstrap-starter`, `cargo run -p bootstrap-starter`) rather than taking this one's.
    - src/bootstrap/transport
    - src/bootstrap/starter
    - tools/conventions
    - rustfmt.toml
    - .gitignore
    - Cargo.lock
  contracts: src/shared_kernel/application/src/integration_events
  manifest: Cargo.toml
  members: ['src/architecture/*', 'src/shared_kernel/*', 'src/contexts/*/*', 'src/bootstrap/*', 'tools/*']
  # The Tracker's read model carries its times (chrono); the transport is axum on tokio, with
  # tower's layers; the starter's end-to-end suite speaks HTTP with reqwest.
  dependencies: [uuid, futures, indexmap, pollster, serde, serde_json, serde_yaml, toml, chrono, axum, tokio, tower, tower-http, reqwest]
  inventory: true
  install: cargo build
  test: cargo test

# The files that show a rule, by id. The rule itself is in architecture.yaml.
rules:
  ARCH-RELATIVE:
    references: [CLAUDE.md]
  ARCH-TREES:
    references: [src/architecture, src/shared_kernel]
  ARCH-INWARD:
    references:
      - src/contexts/notes/domain/Cargo.toml
      - src/contexts/notes/application/Cargo.toml
      - src/contexts/notes/presentation/Cargo.toml
  ARCH-APPLICATION-SPECS:
    references: [src/contexts/notes/application/src/commands/mod.rs]
  ARCH-INFRASTRUCTURE:
    references: [src/contexts/notes/infrastructure/Cargo.toml]
  ARCH-PRESENTATION:
    references: [src/contexts/notes/presentation/src/lib.rs]
  ARCH-WIRING:
    references: [src/contexts/notes/wiring/src/lib.rs]
  ARCH-E2E:
    references: [src/bootstrap/tests/support/mod.rs, src/bootstrap/starter/tests/create_application.rs]
  ARCH-MODULES-DATA:
    references: [src/contexts/notes/wiring/src/lib.rs]
  ARCH-ONE-HANDLER:
    references: [src/contexts/notes/wiring/src/lib.rs]
  ARCH-EXECUTION-CONTEXT:
    references: [src/architecture/application/src/execution_context.rs]
  DOMAIN-RESULT:
    references: [src/architecture/domain/src/result.rs, src/architecture/application/src/command_handler.rs]
  DOMAIN-RECORDS-EVENTS:
    references: [src/architecture/domain/src/aggregate_root.rs]
  DOMAIN-CREATE-VS-RECONSTITUTE:
    references: [src/contexts/notes/domain/src/note/mod.rs]
  DOMAIN-NON-DETERMINISM:
    references: [src/contexts/notes/application/src/commands/suggest_note_title.rs]
  EVENT-AFTER-COMMIT:
    references: [src/architecture/application/src/domain_events.rs, src/architecture/infrastructure/src/event_bus.rs]
  CTX-CONTRACTS:
    references:
      - src/contexts/notes/infrastructure/src/directories.rs
      - src/contexts/notes/application/src/events/note_shared_handler.rs
      - src/contexts/notifications/application/src/events/note_shared_handler.rs
  CONC-OPTIMISTIC:
    references: [src/contexts/notes/infrastructure/src/repositories.rs, src/architecture/application/src/command_handler.rs]
  API-ONE-SURFACE:
    references: [src/contexts/tracker/application/src/projection.rs, src/bootstrap/tests/operation_routes.rs]
  ARCH-MAP-IS-REAL:
    references: [tools/conventions/src/main.rs]
  ARCH-ONE-APPLICATION:
    references: [tools/conventions/src/inventory.rs]

# The file that shows each verb of the HTTP grammar: the Notes routes for the grammar, the auth
# routes for the one exception.
verbs:
  read: src/contexts/notes/presentation/src/lib.rs
  create: src/contexts/notes/presentation/src/lib.rs
  act: src/contexts/notes/presentation/src/lib.rs
  create-under: src/contexts/notes/presentation/src/lib.rs
  replace: src/contexts/notes/presentation/src/lib.rs
  replace-part: src/contexts/notes/presentation/src/lib.rs
  change-part: src/contexts/notifications/presentation/src/lib.rs
  remove: src/contexts/notes/presentation/src/lib.rs
  link-in-an-email: src/contexts/security/presentation/src/routes.rs

# What a new thing of each kind is made of in Rust, and where each part goes. The kinds are
# architecture.yaml's. Lowercase placeholders (`<context>`, `<aggregate>`) are filled in
# snake_case, which is what a Rust path wants; `yarn architecture checklist <kind>` prints one.
checklists:
  aggregate:
    place: src/contexts/<context>/domain/src/<aggregate>/mod.rs
    parts:
      - 'The aggregate itself: a struct holding an `AggregateRoot<Event>` in a private field, `create()` (validates, generates the Id, records the creation event) returning `DomainResult`, `from_snapshot()` (records nothing, panics on corrupted data), `to_snapshot()`, `impl Entity`.'
      - '`dtos.rs` beside it: the snapshot struct, `version` included, and the `New<Aggregate>` input.'
      - '`<aggregate>_exceptions.rs`: a `SERVICE` constant, a `kind` constant and a constructor function per rule.'
      - '`events.rs`: one enum, one variant per fact its behaviours record, past tense, minimal payload; `impl Event` and `impl DomainEvent`.'
      - '`ports/<aggregate>_repository.rs`: a trait with `find_by_id` and `save` returning `DomainResult`, plus the facts a rule needs about the collection.'
      - '`ports/<aggregate>_queries.rs` and its read models, when a screen reads it.'
      - 'A `#[cfg(test)] mod tests` at the bottom of `mod.rs`: every rule, and the round-trip through the snapshot.'
      - 'An in-memory adapter per port in the `infrastructure` crate, and a contract test once a port promises an order or a filter.'
      - 'Wiring in the `wiring` crate: the store, the adapters, the handlers.'
  value-object:
    place: src/contexts/<context>/domain/src/<aggregate>/<name>.rs
    parts:
      - 'A newtype with a private field, `create()` returning `DomainResult`, the rule as a `pub const` when there is a number; `#[derive(PartialEq, Clone, Debug)]` and `impl ValueObject`.'
      - 'One exception per rule the user could act on differently, in the aggregate''s exceptions file.'
      - 'A structured value derives or writes `PartialEq` on its fields; the compiler refuses to compare two kinds.'
      - 'A `#[cfg(test)] mod tests` beside it: what it accepts, what it refuses, and equality.'
  domain-service:
    place: src/contexts/<context>/domain/src/<aggregate>/<rule>.rs
    parts:
      - 'Named after the rule it holds (`NoteSharing`), not after a layer.'
      - 'Generic over the ports it needs, taken in `new()`; returns `DomainResult`; holds no logging, no transaction, no publishing.'
      - 'Used when a rule spans several aggregates or needs a fact about the collection; a rule about one aggregate stays a behaviour.'
      - 'A `#[cfg(test)] mod tests` beside it, with a small struct implementing each port.'
  command:
    place: src/contexts/<context>/application/src/commands/<use_case>.rs
    parts:
      - 'The command: a struct with a named payload and nothing more, `impl Event` and `impl CommandEvent` with its `NAME`.'
      - 'The handler in the same file: a struct generic over the ports it takes in `new()`, `impl CommandHandler` with `execute()` — the signed-in guard (`require_signed_in`) at the top, load, ask the aggregate or the domain service, save (`?` on the `DomainResult`), `publish_domain_events`. A command anyone may send (a sign-up) has no `require_signed_in`; its caller follows it by the operation id it was answered, signed in or not (ADR 27).'
      - 'A `guard()` override only for a rule that needs no caller id, such as administrators only.'
      - 'One `pub mod` line in `commands/mod.rs`, and a `pub use` of what the wiring lists; the handlers of one aggregate share the tests at the bottom of that file.'
      - 'At least a happy path and one refusal in the tests; through `handle()` when the rule is in `guard()`.'
      - 'A route in the context''s `presentation` crate: a function taking the request''s `Extension<ExecutionContext>` and `accept(&context, Command { … })`, answering `202 { operationId }`; the handler listed in the wiring crate with `Subscription::command`. A create never answers its new id: the handler returns it (its `Output`), and the client reads it as the operation''s `result` at `GET /v1/tracker/operations/{id}`.'
      - 'An end-to-end case when the flow is user-visible, in a file of its own under the composition root''s `tests/` (`<things>_routes.rs`): it boots the application on a free port and speaks HTTP with `reqwest`, as the starting composition''s own [`create_application.rs`](src/bootstrap/starter/tests/create_application.rs) does; this repository''s suites boot theirs with `start_test_application()` of [`tests/support/mod.rs`](src/bootstrap/tests/support/mod.rs) and follow a `202` with `app.accepted()`.'
  query:
    place: src/contexts/<context>/application/src/queries/<use_case>.rs
    parts:
      - 'A read model and a method on the queries port, with the order and the unknown-id answer in its doc comment.'
      - 'The query: a struct with its parameters (or a unit struct), `impl Query` naming its `Output`; the handler in the same file: a struct holding the queries port, `impl QueryHandler` with `execute()`; it reads the port and nothing else: no sorting, no second port, no aggregate.'
      - 'One `pub mod` line in `queries/mod.rs`.'
      - 'A test in `queries/mod.rs` when the handler holds a visibility or role rule.'
      - 'A route answering synchronously — `module.query::<TheQuery>().handle(…)`, a view struct for the JSON, refusals through the file''s `refuse()` — and the handler listed in the wiring crate with `query()`. A second format (HTMX) is a second `Presenter` in a `ByFormat`, picked by `format_of(&headers)`.'
  integration-event:
    place: src/shared_kernel/application/src/integration_events/<aggregate>_integration_events.rs
    parts:
      - 'An enum of the facts the publishing context tells the others, in its public words, `impl Event` with the published name and `impl IntegrationEvent`, in that context''s file.'
      - 'A payload carrying everything a consumer needs, so it never queries back.'
      - 'A domain event handler in the publishing context that translates the domain event into it and calls `publish_integration_event(event, context).await` — that is where a fact leaves its context, through the outbox, never straight to the bus.'
      - 'An anti-corruption handler in each consuming context (`events/<name>_handler.rs`, like [`notifications/.../note_shared_handler.rs`](src/contexts/notifications/application/src/events/note_shared_handler.rs)), listed in its wiring crate under `integration_events`, on the contract''s published name.'
      - 'Adding one is not an architecture change: the module is where a context publishes, and a feature may publish.'
  event-handler:
    place: src/contexts/<context>/application/src/events/<name>_handler.rs
    parts:
      - '`impl EventHandler` with `type Event` the aggregate''s enum; `execute()` matches the variant its channel carries and returns a `DomainResult`; no guard — the fact was already allowed.'
      - 'A reaction inside its own context, or the translation of a domain event into an integration event (`publish_integration_event(...)`), or an anti-corruption layer over another context''s contract.'
      - 'It runs in a transaction of its own, opened by the provided `handle()` (ADR 30): save what it changes, call `publish_domain_events()` for an aggregate it changed and `publish_integration_event()` for a fact it tells other contexts — never `context.publish()`, which goes straight to the bus, where a rollback could not take it back — and return an `Err` to undo all of it. It is not made idempotent by hand: a fan-out that fails half-way is undone whole, and the bus hands a fact to it once.'
      - 'The facts it publishes carry what the consumer needs as it was at that moment (who the note was shared with when it was archived), in the domain event, rather than read back later; a time in an integration event''s payload is an ISO 8601 `String`.'
      - 'Listed in the wiring crate with `Subscription::reaction("<TheFact>", handler)`, under the domain events or the integration events.'
      - 'A `#[cfg(test)] mod tests` beside it.'
  context:
    place: src/contexts/<context>/
    parts:
      - 'Declared in `contexts` in this file, or no row of the table applies to its crates.'
      - 'Described in `conventions/domain.yaml`: its subdomain, its purpose and its language; a relationship to another context is declared there before the code carries it (CTX-MAP-DECLARED).'
      - 'One crate per layer (`domain`, `application`, `infrastructure`, `presentation`) and the `wiring` crate, nothing else; each crate''s `[dependencies]` are its row of the table.'
      - 'Its own vocabulary: a word that means something else here is a sign the context is right.'
      - 'It asks other contexts through ports it owns, and tells them through integration events; never both sides of a dependency.'
      - 'Registered in the composition root (`src/bootstrap/src/create_application.rs` here, `src/bootstrap/starter/src/lib.rs` in an application `create` made): its store in the list the unit of work snapshots, its module after the Tracker''s, its routes mounted on the transport under its own prefix (`.nest("/notes", note_routes(notes))`), which the transport serves under the API''s (`/v1/notes`).'

# One test style per layer, for the README; the rows the language has so far.
tests:
  - layer: Domain
    example: '`mod tests` in [`note/mod.rs`](src/contexts/notes/domain/src/note/mod.rs)'
    doubles: none
  - layer: Domain service
    example: '`mod tests` in [`note_sharing.rs`](src/contexts/notes/domain/src/note/note_sharing.rs)'
    doubles: a five-line struct implementing the port
  - layer: Application
    example: >-
      `mod tests` in [`commands/mod.rs`](src/contexts/notes/application/src/commands/mod.rs),
      [`delivery.rs`](src/contexts/notifications/application/src/delivery.rs)
    doubles: the in-memory repository *is* the double; the in-memory bus, with a recording handler, says what was published; a fake channel remembers what it received
  - layer: Infrastructure
    example: >-
      `mod tests` in [`tracked_event_bus.rs`](src/contexts/tracker/infrastructure/src/tracked_event_bus.rs),
      [`signed_tokens.rs`](src/contexts/security/infrastructure/src/signed_tokens.rs)
    doubles: real in-memory pieces
  - layer: '**Contract** (one port, every adapter)'
    example: '[`persistence_contract.rs`](src/contexts/notes/infrastructure/src/persistence_contract.rs)'
    doubles: none — every case runs over each entry of `adapters()`, the in-memory and the SQLite pair, same expectations
  - layer: End to end
    example: '[`notes_routes.rs`](src/bootstrap/tests/notes_routes.rs)'
    doubles: >-
      the whole application, booted in-process on a free port by
      [`tests/support/mod.rs`](src/bootstrap/tests/support/mod.rs), spoken to over HTTP; a `202` is followed
      through the Tracker to its outcome

# Where each word of concepts.yaml's vocabulary is shown, by word; the words the language has so far.
vocabulary:
  Building blocks: '[`src/architecture`](src/architecture)'
  Shared kernel: '[`src/shared_kernel`](src/shared_kernel)'
  Bounded context: '[`src/contexts`](src/contexts)'
  Aggregate (root): '[`note/mod.rs`](src/contexts/notes/domain/src/note/mod.rs)'
  Entity: '[`entity.rs`](src/architecture/domain/src/entity.rs)'
  Value object: '[`note_title.rs`](src/contexts/notes/domain/src/note/note_title.rs)'
  Invariant: '`share_with()` in [`note/mod.rs`](src/contexts/notes/domain/src/note/mod.rs)'
  Domain event: '[`events.rs`](src/contexts/notes/domain/src/note/events.rs)'
  Integration event: '[`note_integration_events.rs`](src/shared_kernel/application/src/integration_events/note_integration_events.rs)'
  Command: '`ShareNote` in [`share_note.rs`](src/contexts/notes/application/src/commands/share_note.rs)'
  Query: '[`get_note.rs`](src/contexts/notes/application/src/queries/get_note.rs)'
  Read model: '[`note_queries.rs`](src/contexts/notes/domain/src/note/ports/note_queries.rs)'
  Projection: '[`projection.rs`](src/contexts/tracker/application/src/projection.rs)'
  Port: >-
    [`note_repository.rs`](src/contexts/notes/domain/src/note/ports/note_repository.rs),
    [`account_directory.rs`](src/contexts/notes/domain/src/note/ports/account_directory.rs)
  Adapter: >-
    [`repositories.rs`](src/contexts/notes/infrastructure/src/repositories.rs),
    [`suggestions.rs`](src/contexts/notes/infrastructure/src/suggestions.rs),
    [`directories.rs`](src/contexts/notes/infrastructure/src/directories.rs)
  Repository: '[`note_repository.rs`](src/contexts/notes/domain/src/note/ports/note_repository.rs)'
  Domain service: '[`note_sharing.rs`](src/contexts/notes/domain/src/note/note_sharing.rs)'
  Application service: '[`delivery.rs`](src/contexts/notifications/application/src/delivery.rs)'
  Anti-corruption layer: '[`note_shared_handler.rs`](src/contexts/notifications/application/src/events/note_shared_handler.rs)'
  Snapshot: '[`dtos.rs`](src/contexts/notes/domain/src/note/dtos.rs)'
  Operation: '[`operation.rs`](src/architecture/application/src/operation.rs)'
  Composition root: '[`create_application.rs`](src/bootstrap/src/create_application.rs)'

# The file that shows each concept of concepts.yaml, by id; a concept not listed here is one
# this language does not show yet, and the map says so.
concepts:
  entity:
    canonical: [src/architecture/domain/src/entity.rs]
    notes: 'a trait; the kind is the type, so two kinds cannot even be compared'
  aggregate-root:
    canonical:
      - src/contexts/notes/domain/src/note/mod.rs
      - src/architecture/domain/src/aggregate_root.rs
    example: >-
      [`note/mod.rs`](src/contexts/notes/domain/src/note/mod.rs) holding an
      [`AggregateRoot`](src/architecture/domain/src/aggregate_root.rs)
    notes: 'no inheritance: the aggregate holds the root in a private field and delegates'
  entity-inside-an-aggregate:
    canonical: [src/contexts/notifications/domain/src/notification/delivery_attempt.rs]
    notes: 'created and reached through `Notification` only (`pub(super)`), persisted in its snapshot'
  value-object:
    canonical:
      - src/contexts/notes/domain/src/note/note_title.rs
      - src/shared_kernel/domain/src/email.rs
      - src/contexts/security/domain/src/account/credentials.rs
    example: >-
      [`note_title.rs`](src/contexts/notes/domain/src/note/note_title.rs),
      [`email.rs`](src/shared_kernel/domain/src/email.rs),
      [`credentials.rs`](src/contexts/security/domain/src/account/credentials.rs)
    notes: 'a newtype with a private field deriving `PartialEq`; [`value_object.rs`](src/architecture/domain/src/value_object.rs) names the shape'
    examples: [src/architecture/domain/src/value_object.rs]
  identity:
    canonical: [src/architecture/domain/src/id.rs]
  factory:
    canonical:
      - src/contexts/notes/domain/src/note/mod.rs
      - src/contexts/security/domain/src/account/account_registration.rs
    example: >-
      `Note::create()` in [`note/mod.rs`](src/contexts/notes/domain/src/note/mod.rs); when creation needs a
      port, [`account_registration.rs`](src/contexts/security/domain/src/account/account_registration.rs)
  invariant:
    canonical: [src/contexts/notes/domain/src/note/mod.rs]
    example: '`share_with()` in [`note/mod.rs`](src/contexts/notes/domain/src/note/mod.rs)'
  creation-vs-reconstitution:
    canonical: [src/contexts/notes/domain/src/note/mod.rs]
    example: '`Note::create()` vs `Note::from_snapshot()` in [`note/mod.rs`](src/contexts/notes/domain/src/note/mod.rs)'
    notes: 'corrupted storage panics, which is what a throw is here'
  domain-event:
    canonical: [src/contexts/notes/domain/src/note/events.rs]
    notes: 'one enum per aggregate, one variant per fact; [`event.rs`](src/architecture/domain/src/event.rs) has the three kinds as traits'
    examples: [src/architecture/domain/src/event.rs]
  domain-exception:
    canonical: [src/contexts/notes/domain/src/note/note_exceptions.rs]
    notes: 'a `kind` constant and a constructor function per rule, building an [`Exception`](src/architecture/domain/src/exception.rs)'
    examples: [src/architecture/domain/src/exception.rs]
  result:
    canonical: [src/architecture/domain/src/result.rs]
    notes: 'the language''s own `Result<T, Exception>`, and `?` where TypeScript wrote `if (r.isFailure()) return r`'
  optimistic-concurrency:
    canonical:
      - src/architecture/domain/src/aggregate_root.rs
      - src/contexts/notes/infrastructure/src/repositories.rs
    example: >-
      `AggregateRoot::version` in [`aggregate_root.rs`](src/architecture/domain/src/aggregate_root.rs);
      `save()` in [`repositories.rs`](src/contexts/notes/infrastructure/src/repositories.rs)
  repository-port:
    canonical: [src/contexts/notes/domain/src/note/ports/note_repository.rs]
    notes: 'a trait whose methods return `impl Future`, so an adapter may be in-memory or a database'
  queries-port-read-models:
    canonical: [src/contexts/notes/domain/src/note/ports/note_queries.rs]
  snapshot-dto:
    canonical: [src/contexts/notes/domain/src/note/dtos.rs]
  domain-service:
    canonical:
      - src/contexts/security/domain/src/account/account_registration.rs
      - src/contexts/notes/domain/src/note/note_sharing.rs
    example: >-
      [`account_registration.rs`](src/contexts/security/domain/src/account/account_registration.rs),
      [`note_sharing.rs`](src/contexts/notes/domain/src/note/note_sharing.rs)
    notes: 'generic over its port, so a test hands it a five-line struct'
