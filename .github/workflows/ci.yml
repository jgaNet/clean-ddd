name: ci

# One job per language, each run from its own directory with its own toolchain, and one `check`
# job that fans them in, which is what the branch protection requires. There is no
# path filter on purpose: a change to the contract, to a decision or to a shared document must
# run every language's checks, since every language's documents are rendered from them.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Conventions
        run: yarn check:conventions

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:units

      - name: End-to-end tests
        run: yarn test:e2e

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Conventions
        run: cargo run -q -p conventions

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  # The one check the branch protection requires: green when every language's job is. A new
  # language is added to `needs`, and nothing else changes.
  check:
    runs-on: ubuntu-latest
    needs: [typescript, rust]
    if: always()
    steps:
      - name: Every language is green
        run: |
          echo "typescript: ${{ needs.typescript.result }}"
          echo "rust: ${{ needs.rust.result }}"
          test "${{ needs.typescript.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
