name: ci

# One job per language, each run from its own directory with its own toolchain. There is no
# path filter on purpose: a change to the contract, to a decision or to a shared document must
# run every language's checks, since every language's documents are rendered from them.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Conventions
        run: yarn check:conventions

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:units

      - name: End-to-end tests
        run: yarn test:e2e
