name: ci

# One job per language, each run from its own directory with its own toolchain, and one `check`
# job that fans them in, which is what the branch protection requires. Each language's job ends
# by starting its server and running the one API scenario against it (api/scenario.mjs). There is no
# path filter on purpose: a change to the contract, to a decision or to a shared document must
# run every language's checks, since every language's documents are rendered from them.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Conventions
        run: yarn check:conventions

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:units

      - name: End-to-end tests
        run: yarn test:e2e

      - name: The API every language answers
        run: |
          yarn build
          PORT=10000 node dist/application.js > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 || (cat server.log; exit 1)

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Conventions
        run: cargo run -q -p conventions

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          cargo build -q -p bootstrap
          PORT=10000 ./target/debug/application > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 || (cat server.log; exit 1)

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Conventions
        run: uv run python -m tools.conventions

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          PORT=10000 uv run python -m bootstrap > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 || (cat server.log; exit 1)

  # The one check the branch protection requires: green when every language's job is. A new
  # language is added to `needs`, and nothing else changes.
  check:
    runs-on: ubuntu-latest
    needs: [typescript, rust, python]
    if: always()
    steps:
      - name: Every language is green
        run: |
          echo "typescript: ${{ needs.typescript.result }}"
          echo "rust: ${{ needs.rust.result }}"
          echo "python: ${{ needs.python.result }}"
          test "${{ needs.typescript.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
