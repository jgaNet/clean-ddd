name: ci

# One job for the tooling at the root (the `clean-ddd` package: the conventions check of the
# whole repository, its own specs, its build), one job per language, each run from its own
# directory with its own toolchain, one job for the site, and one `check` job that fans them in,
# which is what the branch protection requires. Each language's job ends by starting its server
# and running the one API scenario against it (api/scenario.mjs). The only path filter is the
# site's: a change that touches nothing outside `site/` runs the site's job alone, since no
# language reads the site; anything else runs every language's checks, since a change to the
# contract, to a decision or to a shared document renders every language's documents.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # What the change touches: only the site, or anything else. On a pull request the diff is the
  # one the pull request makes; on a push to main, the one the push makes. When the base cannot be
  # read (a first push), everything runs.
  scope:
    runs-on: ubuntu-latest
    outputs:
      only_site: ${{ steps.files.outputs.only_site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does the change touch anything outside site/?
        id: files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "no readable base: everything runs"
            echo "only_site=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^site/'; then
            echo "only the site changed: the languages' checks are skipped"
            echo "only_site=true" >> "$GITHUB_OUTPUT"
          else
            echo "only_site=false" >> "$GITHUB_OUTPUT"
          fi

  # The site is what its scripts build from the records: a stale page fails. This job runs on
  # every change, since the records the site reads live outside site/.
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Rebuild the site and refuse a stale page
        run: |
          yarn site
          git diff --exit-code -- site/

      - name: Format
        run: yarn prettier "site/**/*.mjs" --check

  tools:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.only_site != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            typescript/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Install the TypeScript language (its ESLint answers the import probes)
        run: yarn install --frozen-lockfile
        working-directory: typescript

      - name: Conventions, every language and every document
        run: yarn check:conventions

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Specs
        run: yarn test

      - name: The flow's supervision (isolated dependencies, the reserved budget, the port an agent leaves)
        run: yarn test:flow

      - name: Build, and what the package would ship
        run: |
          yarn build
          npm pack --dry-run

  typescript:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.only_site != 'true'
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:units

      - name: End-to-end tests
        run: yarn test:e2e

      - name: The API every language answers
        run: |
          yarn build
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 ADMIN_IDENTIFIER=admin@admin.fr ADMIN_PASSWORD=admin node dist/application.js > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  rust:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.only_site != 'true'
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Conventions
        run: cargo run -q -p conventions

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          cargo build -q -p bootstrap
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 ADMIN_IDENTIFIER=admin@admin.fr ADMIN_PASSWORD=admin ./target/debug/application > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  python:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.only_site != 'true'
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Conventions
        run: uv run python -m tools.conventions

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          # The server runs from the environment uv sync built, not under uv run: a uv process left running
          # holds the cache lock, and setup-uv's cache pruning waits on it until the job fails.
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 ADMIN_IDENTIFIER=admin@admin.fr ADMIN_PASSWORD=admin .venv/bin/python -m bootstrap > server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  go:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.only_site != 'true'
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Conventions
        run: go run ./tools/conventions

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          working-directory: go

      - name: Tests
        run: go test ./...

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          go build -o /tmp/application ./bootstrap/cmd/application
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 ADMIN_IDENTIFIER=admin@admin.fr ADMIN_PASSWORD=admin /tmp/application > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  # The front end stands alone: served by the dependency-free static server, with no API behind.
  web:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.only_site != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The HTMX front end is served as a static folder
        run: |
          node web/serve.mjs web/htmx --port 8080 --api http://127.0.0.1:10000 > web.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8080/ | grep -q '<meta name="api-base" content="http://127.0.0.1:10000" />'
          curl -sf http://127.0.0.1:8080/me | grep -q '<script src="/js/htmx.min.js"></script>'
          curl -sf http://127.0.0.1:8080/js/api.js | grep -q 'htmx.createWebSocket'

  # The one check the branch protection requires: green when every job that had to run is. A new
  # language is added to `needs`, and nothing else changes. A job the scope skipped counts as green
  # only when the change touched the site alone.
  check:
    runs-on: ubuntu-latest
    needs: [scope, site, tools, typescript, rust, python, go, web]
    if: always()
    steps:
      - name: Every job that had to run is green
        env:
          NEEDS: ${{ toJSON(needs) }}
          ONLY_SITE: ${{ needs.scope.outputs.only_site }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e --arg only "$ONLY_SITE" '
            to_entries | all(.value.result == "success" or ($only == "true" and .value.result == "skipped"))
          ' > /dev/null
