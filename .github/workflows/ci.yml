name: ci

# One job for the tooling at the root (the `clean-ddd` package: the conventions check of the
# whole repository, its own specs, its build), one job per language, each run from its own
# directory with its own toolchain, and one `check` job that fans them in, which is what the
# branch protection requires. Each language's job ends by starting its server and running the
# one API scenario against it (api/scenario.mjs). There is no path filter on purpose: a change to
# the contract, to a decision or to a shared document must run every language's checks, since
# every language's documents are rendered from them.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            typescript/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Install the TypeScript language (its ESLint answers the import probes)
        run: yarn install --frozen-lockfile
        working-directory: typescript

      - name: Conventions, every language and every document
        run: yarn check:conventions

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Specs
        run: yarn test

      - name: Build, and what the package would ship
        run: |
          yarn build
          npm pack --dry-run

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Format
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test:units

      - name: End-to-end tests
        run: yarn test:e2e

      - name: The API every language answers
        run: |
          yarn build
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 node dist/application.js > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Conventions
        run: cargo run -q -p conventions

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          cargo build -q -p bootstrap
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 ./target/debug/application > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Conventions
        run: uv run python -m tools.conventions

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Tests
        run: uv run pytest

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          # The server runs from the environment uv sync built, not under uv run: a uv process left running
          # holds the cache lock, and setup-uv's cache pruning waits on it until the job fails.
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 .venv/bin/python -m bootstrap > server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Conventions
        run: go run ./tools/conventions

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          working-directory: go

      - name: Tests
        run: go test ./...

      - name: Use Node (for the shared API scenario)
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The API every language answers
        run: |
          go build -o /tmp/application ./bootstrap/cmd/application
          PORT=10000 WEB_ORIGINS=http://127.0.0.1:8080 /tmp/application > server.log 2>&1 &
          ../.github/wait-for-health.sh http://127.0.0.1:10000 || (cat server.log; exit 1)
          node ../api/scenario.mjs http://127.0.0.1:10000 --origin http://127.0.0.1:8080 || (cat server.log; exit 1)

  # The front end stands alone: served by the dependency-free static server, with no API behind.
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version-file: typescript/.nvmrc

      - name: The HTMX front end is served as a static folder
        run: |
          node web/serve.mjs web/htmx --port 8080 --api http://127.0.0.1:10000 > web.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8080/ | grep -q '<meta name="api-base" content="http://127.0.0.1:10000" />'
          curl -sf http://127.0.0.1:8080/me | grep -q '<script src="/js/htmx.min.js"></script>'
          curl -sf http://127.0.0.1:8080/js/api.js | grep -q 'htmx.createWebSocket'

  # The one check the branch protection requires: green when every language's job is. A new
  # language is added to `needs`, and nothing else changes.
  check:
    runs-on: ubuntu-latest
    needs: [tools, typescript, rust, python, go, web]
    if: always()
    steps:
      - name: Every language is green
        run: |
          echo "tools: ${{ needs.tools.result }}"
          echo "typescript: ${{ needs.typescript.result }}"
          echo "rust: ${{ needs.rust.result }}"
          echo "python: ${{ needs.python.result }}"
          echo "go: ${{ needs.go.result }}"
          echo "web: ${{ needs.web.result }}"
          test "${{ needs.tools.result }}" = "success"
          test "${{ needs.typescript.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.go.result }}" = "success"
          test "${{ needs.web.result }}" = "success"
